<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>水果切切乐 - 超级解压小游戏</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="game-page">
  <div data-ad-slot="banner-top" class="ad-slot-wrap"></div>
  <div class="game-topbar">
    <a class="back-btn" href="../../index.html">← 返回游戏大厅</a>
    <div class="game-title">🍉 水果切切乐</div>
  </div>

  <div class="arcade-wrap">
    <div class="arcade-hud">
      <div class="arcade-stat"><span class="lbl">得分</span><span class="val" id="score">0</span></div>
      <div class="arcade-stat combo"><span class="lbl">连击</span><span class="val" id="combo">0</span></div>
      <div class="arcade-stat hi"><span class="lbl">最高</span><span class="val" id="best">0</span></div>
    </div>

    <div class="arcade-canvas-box" id="box">
      <canvas id="cv"></canvas>
      <div class="arcade-overlay show" id="startOv">
        <div class="arcade-panel">
          <div class="p-emoji">🍉</div>
          <h2>水果切切乐</h2>
          <p class="p-sub">划动屏幕切水果！但要按顶部提示的颜色顺序切——切对连击加分，切错扣分断连击。❄️冰冻水果千万别碰！</p>
          <button class="arcade-btn primary big" id="startBtn">开始游戏</button>
        </div>
      </div>
      <div class="arcade-overlay" id="endOv">
        <div class="arcade-panel">
          <div class="p-emoji">🏆</div>
          <h2>时间到</h2>
          <div class="p-score">本次得分 <b id="finalScore">0</b></div>
          <div id="newBest" class="p-new" style="display:none">🎉 新纪录！</div>
          <button class="arcade-btn primary big" id="againBtn">再来一局</button>
        </div>
      </div>
    </div>

    <div class="arcade-controls">
      <button class="arcade-btn" id="muteBtn">🔊 音效开</button>
      <button class="arcade-btn" id="resetBtn">↺ 重新开始</button>
    </div>
    <p class="arcade-tip">按住划动切水果，必须按顶部提示的顺序切！切对连击加分，切错扣分，冰冻水果碰不得。60秒限时。</p>
  </div>

  <div data-ad-slot="banner-bottom" class="ad-slot-wrap"></div>

  <script src="../../js/ads.js"></script>
  <script src="../../js/arcade-kit.js"></script>
  <script>
  (function () {
    'use strict';
    var A = window.Arcade;
    var W = 400, H = 600;
    var cv = document.getElementById('cv');
    var ctx = A.fitCanvas(cv, W, H);
    var box = document.getElementById('box');
    var $ = function (id) { return document.getElementById(id); };

    // 水果类型：emoji/颜色/名称
    var FRUITS = [
      { e: '🍉', c: '#FF5B7C', name: '西瓜' },
      { e: '🍊', c: '#FFB23F', name: '橘子' },
      { e: '🥝', c: '#7FD94A', name: '猕猴桃' },
      { e: '🍇', c: '#B77BFF', name: '葡萄' },
      { e: '🍍', c: '#FFD84A', name: '菠萝' }
    ];
    var scores, combo, best = A.Best.get('fruitslice');
    var fruits, halves, particles, floaters, blades;
    var running, over, lastTs, timeLeft, spawnT, targetType, targetSeq;
    var slashing = false, lastPoint = null;

    function reset() {
      scores = 0; combo = 0; fruits = []; halves = [];
      particles = new A.Particles(); floaters = new A.Floaters(); blades = [];
      running = false; over = false; timeLeft = 60; spawnT = 0;
      targetSeq = []; nextTarget();
      updateHud();
      $('endOv').classList.remove('show');
      $('startOv').classList.add('show');
    }
    function start() { $('startOv').classList.remove('show'); running = true; lastTs = performance.now(); }
    function updateHud() { $('score').textContent = scores; $('combo').textContent = combo; $('best').textContent = best; }
    function nextTarget() {
      var t = A.randInt(0, FRUITS.length - 1);
      targetType = t;
      targetSeq = [t];
      for (var i = 0; i < 6; i++) targetSeq.push(A.randInt(0, FRUITS.length - 1));
    }
    function spawnFruit() {
      var x = A.rand(50, W - 50);
      var vx = A.rand(-70, 70);
      var vy = A.rand(-540, -430);
      var frozen = Math.random() < 0.12;
      var type = (Math.random() < 0.55) ? targetType : A.randInt(0, FRUITS.length - 1);
      fruits.push({ x: x, y: H + 30, vx: vx, vy: vy, type: type, frozen: frozen, r: A.rand(24, 32), rot: A.rand(0, 6.28), vr: A.rand(-3, 3), sliced: false });
    }

    function slash(from, to) {
      // 检测线段切过的水果
      for (var i = fruits.length - 1; i >= 0; i--) {
        var f = fruits[i];
        if (f.sliced) continue;
        if (distPointSeg(f.x, f.y, from.x, from.y, to.x, to.y) < f.r + 8) {
          sliceFruit(f, i);
        }
      }
    }
    function sliceFruit(f, i) {
      f.sliced = true;
      fruits.splice(i, 1);
      if (f.frozen) {
        // 切到冰冻：重罚
        scores = Math.max(0, scores - 30); combo = 0;
        A.SFX.fail(); A.vibrate(60);
        floaters.add(f.x, f.y, '❄️ -30', '#7FD8FF', 22);
        particles.burst(f.x, f.y, { count: 18, colors: ['#BEEFFF', '#fff'], speedMax: 220 });
        updateHud(); return;
      }
      var correct = (f.type === targetType);
      if (correct) {
        combo++;
        var gain = 10 + combo * 2;
        scores += gain;
        A.SFX.combo(combo); A.vibrate(15);
        floaters.add(f.x, f.y, '+' + gain + (combo > 1 ? ' x' + combo : ''), '#FFE066', 20);
        particles.burst(f.x, f.y, { count: 14, colors: [FRUITS[f.type].c, '#fff'], speedMax: 260 });
        targetSeq.shift(); targetSeq.push(A.randInt(0, FRUITS.length - 1));
        targetType = targetSeq[0];
      } else {
        scores = Math.max(0, scores - 10); combo = 0;
        A.SFX.fail(); A.vibrate(30);
        floaters.add(f.x, f.y, '切错 -10', '#FF7B7B', 20);
        particles.burst(f.x, f.y, { count: 10, colors: ['#999'], speedMax: 180 });
      }
      // 两半
      halves.push({ x: f.x, y: f.y, vx: f.vx, vy: f.vy, type: f.type, r: f.r, life: 1, dir: -1 });
      halves.push({ x: f.x, y: f.y, vx: f.vx, vy: f.vy, type: f.type, r: f.r, life: 1, dir: 1 });
      updateHud();
    }
    function distPointSeg(px, py, x1, y1, x2, y2) {
      var dx = x2 - x1, dy = y2 - y1;
      var l2 = dx * dx + dy * dy;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      var t = A.clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1);
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function gameOver() {
      over = true; running = false;
      var isNew = scores > best;
      if (isNew) { best = scores; A.Best.set('fruitslice', best); }
      updateHud();
      $('finalScore').textContent = scores;
      $('newBest').style.display = isNew ? 'inline-block' : 'none';
      $('endOv').classList.add('show');
      A.SFX.win();
    }

    function loop(ts) {
      var dt = Math.min((ts - lastTs) / 1000 || 0, 0.033);
      lastTs = ts;
      if (running && !over) {
        timeLeft -= dt;
        if (timeLeft <= 0) { timeLeft = 0; gameOver(); }
        spawnT -= dt;
        if (spawnT <= 0) { spawnFruit(); spawnT = A.rand(0.35, 0.7); }
        for (var i = fruits.length - 1; i >= 0; i--) {
          var f = fruits[i];
          f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
          if (f.y > H + 60) {
            if (!f.frozen) { combo = 0; updateHud(); }
            fruits.splice(i, 1);
          }
        }
        for (var h = halves.length - 1; h >= 0; h--) {
          var ha = halves[h];
          ha.vy += 900 * dt; ha.x += ha.vx * dt; ha.y += ha.vy * dt; ha.life -= dt * 0.8;
          if (ha.life <= 0) halves.splice(h, 1);
        }
      }
      for (var b = blades.length - 1; b >= 0; b--) { blades[b].life -= dt * 3; if (blades[b].life <= 0) blades.splice(b, 1); }
      particles.update(dt); floaters.update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      // 背景：木纹砧板风
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#2E4A3A'); g.addColorStop(1, '#1E3328');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // 砧板纹理
      ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 2;
      for (var i = 0; i < 10; i++) { ctx.beginPath(); ctx.moveTo(0, i * 65); ctx.lineTo(W, i * 65 + 20); ctx.stroke(); }
      // 目标提示条
      drawTargetBar();
      // 时间条
      drawTimeBar();
      // 水果
      fruits.forEach(function (f) {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.font = (f.r * 2.2) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(FRUITS[f.type].e, 0, 0);
        if (f.frozen) {
          ctx.strokeStyle = '#8EE5FF'; ctx.lineWidth = 4;
          ctx.shadowColor = '#8EE5FF'; ctx.shadowBlur = 14;
          ctx.beginPath(); ctx.arc(0, 0, f.r + 2, 0, 6.28); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#8EE5FF'; ctx.font = '14px sans-serif'; ctx.fillText('❄', 0, 0);
        }
        ctx.restore();
      });
      // 两半
      halves.forEach(function (ha) {
        ctx.save(); ctx.globalAlpha = A.clamp(ha.life, 0, 1);
        ctx.translate(ha.x + ha.dir * 6, ha.y); ctx.rotate(ha.dir * 0.5);
        ctx.font = (ha.r * 1.6) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(FRUITS[ha.type].e, 0, 0); ctx.restore();
      });
      // 刀光
      blades.forEach(function (bl) {
        ctx.save(); ctx.globalAlpha = bl.life;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.shadowColor = '#9FF'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(bl.x1, bl.y1); ctx.lineTo(bl.x2, bl.y2); ctx.stroke();
        ctx.restore();
      });
      particles.draw(ctx); floaters.draw(ctx);
    }
    function drawTargetBar() {
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      A.roundRectPath(ctx, 10, 10, W - 20, 52, 14); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('现在切：', 22, 36);
      // 当前目标大图标
      ctx.font = '34px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(FRUITS[targetType].e, 138, 36);
      // 后续序列小图标
      for (var i = 1; i < Math.min(targetSeq.length, 7); i++) {
        ctx.globalAlpha = 1 - (i - 1) * 0.13;
        ctx.font = '20px sans-serif';
        ctx.fillText(FRUITS[targetSeq[i]].e, 190 + (i - 1) * 30, 36);
      }
      ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
    }
    function drawTimeBar() {
      var ratio = timeLeft / 60;
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      A.roundRectPath(ctx, 10, 68, W - 20, 12, 6); ctx.fill();
      ctx.fillStyle = ratio < 0.25 ? '#FF5B7C' : '#4DD6A0';
      A.roundRectPath(ctx, 10, 68, (W - 20) * ratio, 12, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(timeLeft) + 's', W / 2, 98);
    }

    function setPoint(e) {
      var rect = cv.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / rect.width * W, y: (e.clientY - rect.top) / rect.height * H };
    }
    box.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (!running || over) return;
      slashing = true; lastPoint = setPoint(e);
    });
    box.addEventListener('pointermove', function (e) {
      if (!slashing || !running || over) return;
      var p = setPoint(e);
      if (lastPoint && Math.hypot(p.x - lastPoint.x, p.y - lastPoint.y) > 4) {
        slash(lastPoint, p);
        blades.push({ x1: lastPoint.x, y1: lastPoint.y, x2: p.x, y2: p.y, life: 1 });
        lastPoint = p;
      }
    });
    window.addEventListener('pointerup', function () { slashing = false; lastPoint = null; });
    $('startBtn').addEventListener('click', start);
    $('againBtn').addEventListener('click', reset);
    $('resetBtn').addEventListener('click', reset);
    $('muteBtn').addEventListener('click', function () {
      var m = !A.isMuted(); A.setMuted(m); $('muteBtn').textContent = m ? '🔇 音效关' : '🔊 音效开';
    });

    reset();
    requestAnimationFrame(function (t) { lastTs = t; loop(t); });
  })();
  </script>
</body>
</html>
