<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>滑块拼图 - 洪哥做的好耍小游戏</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="game-page">
  <div data-ad-slot="banner-top" class="ad-slot-wrap"></div>
  <div class="game-topbar">
    <a class="back-btn" href="../../index.html">← 返回游戏大厅</a>
    <div class="game-title">🧩 滑块拼图</div>
  </div>

  <div class="arcade-wrap">
    <div class="arcade-hud">
      <div class="arcade-stat"><span class="lbl">步数</span><span class="val" id="moves">0</span></div>
      <div class="arcade-stat combo"><span class="lbl">用时</span><span class="val" id="time">0s</span></div>
      <div class="arcade-stat hi"><span class="lbl">评级</span><span class="val" id="rank">—</span></div>
    </div>

    <div class="arcade-canvas-box" id="box">
      <canvas id="cv"></canvas>
      <div class="arcade-overlay show" id="startOv">
        <div class="arcade-panel">
          <div class="p-emoji">🧩</div>
          <h2>滑块拼图</h2>
          <p class="p-sub">点击空位旁边的图块，把打乱的图案拼回原样！3×3 滑块，步数越少、用时越短，评级越高。旁边有原图参考，仔细看！</p>
          <button class="arcade-btn primary big" id="startBtn">开始游戏</button>
        </div>
      </div>
      <div class="arcade-overlay" id="endOv">
        <div class="arcade-panel">
          <div class="p-emoji" id="endEmoji">🏆</div>
          <h2>拼好啦！</h2>
          <div class="p-score">步数 <b id="finalScore">0</b> · 用时 <b id="finalTime">0s</b></div>
          <div id="newBest" class="p-new" style="display:none">🎉 新纪录！</div>
          <button class="arcade-btn primary big" id="againBtn">再来一局</button>
        </div>
      </div>
    </div>

    <div class="arcade-controls">
      <button class="arcade-btn" id="shuffleBtn">🔀 重新打乱</button>
      <button class="arcade-btn" id="muteBtn">🔊 音效开</button>
    </div>
    <p class="arcade-tip">点击空位上下左右的图块移动它，把图案拼回原样。步数少、用时短能拿高评级！</p>
  </div>

  <div data-ad-slot="banner-bottom" class="ad-slot-wrap"></div>

  <script src="../../js/ads.js"></script>
  <script src="../../js/arcade-kit.js"></script>
  <script>
  (function () {
    'use strict';
    var A = window.Arcade;
    var N = 3, CELL = 92, GAP = 6, PAD = 12;
    var BOARD = N * CELL + (N - 1) * GAP;
    var W = PAD * 2 + BOARD * 2 + 20;
    var H = PAD * 2 + BOARD + 50;
    var cv = document.getElementById('cv');
    var ctx = A.fitCanvas(cv, W, H);
    var box = document.getElementById('box');
    var $ = function (id) { return document.getElementById(id); };

    // 图案主题：用 canvas 绘制的场景（编号对应绘制函数）
    var THEMES = [
      { name: '彩虹天空', sky: ['#87CEEB', '#E8F8E0'], draw: 'rainbow' },
      { name: '向日葵', sky: ['#FFE066', '#FFF4C4'], draw: 'sunflower' },
      { name: '夜空', sky: ['#1E2A5A', '#4A3E8E'], draw: 'night' },
      { name: '花园', sky: ['#B8E4F5', '#E8F8E0'], draw: 'garden' }
    ];

    var tiles, theme, moves, startTime, elapsed, running, over, lastTs, particles, floaters, bestMoves;
    bestMoves = A.Best.get('slidepuzzle');
    var BX = PAD, BY = PAD + 26;

    function reset(newTheme) {
      if (newTheme !== undefined || theme === undefined) theme = THEMES[A.randInt(0, THEMES.length - 1)];
      // 3x3: 0..7 图块，8 是空位
      tiles = []; for (var i = 0; i < 8; i++) tiles.push(i); tiles.push(8);
      // 打乱：随机合法移动多次
      var blank = 8;
      for (var s = 0; s < 120; s++) {
        var ns = neighborsIdx(blank);
        var pick = ns[A.randInt(0, ns.length - 1)];
        var tmp = tiles[blank]; tiles[blank] = tiles[pick]; tiles[pick] = tmp;
        blank = pick;
      }
      // 若碰巧还原，再打乱一次
      if (isSolved()) reset(true);
      moves = 0; elapsed = 0; running = false; over = false;
      particles = new A.Particles(); floaters = new A.Floaters();
      updateHud();
      $('endOv').classList.remove('show');
      $('startOv').classList.add('show');
    }
    function start() {
      $('startOv').classList.remove('show'); running = true;
      startTime = performance.now(); lastTs = startTime;
    }
    function updateHud() {
      $('moves').textContent = moves;
      $('time').textContent = Math.floor(elapsed) + 's';
      $('rank').textContent = over ? $('rank').textContent : '—';
    }
    function neighborsIdx(idx) {
      var r = Math.floor(idx / N), c = idx % N;
      var out = [];
      if (r > 0) out.push(idx - N);
      if (r < N - 1) out.push(idx + N);
      if (c > 0) out.push(idx - 1);
      if (c < N - 1) out.push(idx + 1);
      return out;
    }
    function clickTile(idx) {
      if (!running || over) return;
      var blank = tiles.indexOf(8);
      if (neighborsIdx(blank).indexOf(idx) < 0) {
        A.SFX.click(); return;
      }
      var tmp = tiles[blank]; tiles[blank] = tiles[idx]; tiles[idx] = tmp;
      moves++; A.SFX.tap(); A.vibrate(8);
      updateHud();
      if (isSolved()) gameOver();
    }
    function isSolved() {
      for (var i = 0; i < 8; i++) if (tiles[i] !== i) return false;
      return true;
    }
    function gameOver() {
      over = true; running = false;
      var score = moves + Math.floor(elapsed) * 2;
      var rank = score <= 40 ? '🏆 S' : score <= 70 ? '🥇 A' : score <= 110 ? '🥈 B' : '🥉 C';
      $('rank').textContent = rank;
      var isNew = bestMoves === 0 || moves < bestMoves;
      if (isNew) { bestMoves = moves; A.Best.set('slidepuzzle', bestMoves); }
      $('finalScore').textContent = moves;
      $('finalTime').textContent = Math.floor(elapsed) + 's';
      $('endEmoji').textContent = rank.charAt(0);
      $('newBest').style.display = isNew ? 'inline-block' : 'none';
      $('endOv').classList.add('show');
      // 庆祝粒子
      particles.burst(W / 2, H / 2, { count: 30, colors: ['#FFD84A', '#FF5B7C', '#4DFF88', '#fff'], speedMax: 320, lifeMax: 1.2 });
      A.SFX.win(); A.vibrate(40);
    }

    function loop(ts) {
      var dt = Math.min((ts - lastTs) / 1000 || 0, 0.033);
      lastTs = ts;
      if (running && !over) { elapsed = (performance.now() - startTime) / 1000; $('time').textContent = Math.floor(elapsed) + 's'; }
      particles.update(dt); floaters.update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    function draw() {
      ctx.fillStyle = '#1E2A4A'; ctx.fillRect(0, 0, W, H);
      // 标题
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('🧩 原图参考：' + theme.name, BX, 14);
      ctx.fillText('拼图区 →', BX + BOARD + 30, 14);
      ctx.textBaseline = 'alphabetic';
      // 原图参考（小）
      drawScene(BX, BY, BOARD, theme, null);
      // 拼图区
      for (var i = 0; i < 9; i++) {
        var v = tiles[i];
        var r = Math.floor(i / N), c = i % N;
        var x = BX + BOARD + 20 + PAD + c * (CELL + GAP);
        var y = BY + r * (CELL + GAP);
        if (v === 8) {
          ctx.fillStyle = 'rgba(0,0,0,.3)'; A.roundRectPath(ctx, x, y, CELL, CELL, 6); ctx.fill();
          continue;
        }
        // 绘制该图块对应的场景区域：把完整场景画在原点，平移使第(vr,vc)块落到(x,y)
        ctx.save();
        A.roundRectPath(ctx, x, y, CELL, CELL, 4); ctx.clip();
        var vr = Math.floor(v / N), vc = v % N;
        ctx.translate(x - vc * (CELL + GAP), y - vr * (CELL + GAP));
        drawScene(0, 0, BOARD, theme, null);
        ctx.restore();
        // 边框
        ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
        A.roundRectPath(ctx, x, y, CELL, CELL, 4); ctx.stroke();
        // 编号角标
        ctx.fillStyle = 'rgba(0,0,0,.35)'; A.roundRectPath(ctx, x + 2, y + 2, 18, 16, 4); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((v + 1), x + 11, y + 10);
      }
      ctx.textBaseline = 'alphabetic';
      particles.draw(ctx); floaters.draw(ctx);
    }
    // 绘制场景（在给定矩形内），用于原图和图块裁剪
    function drawScene(x, y, size, th, _) {
      // 天空渐变
      var g = ctx.createLinearGradient(x, y, x, y + size);
      g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
      ctx.fillStyle = g; ctx.fillRect(x, y, size, size);
      var cx = x + size / 2, cy = y + size / 2;
      if (th.draw === 'rainbow') {
        // 彩虹弧
        var cols = ['#FF5B7C', '#FF9E4A', '#FFE066', '#4DFF88', '#4DA8FF', '#B77BFF'];
        for (var i = 0; i < cols.length; i++) {
          ctx.strokeStyle = cols[i]; ctx.lineWidth = 12;
          ctx.beginPath(); ctx.arc(cx, y + size * 0.9, size * 0.18 + i * 14, Math.PI, 0); ctx.stroke();
        }
        ctx.fillStyle = '#FFF'; ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('☀️', x + size * 0.2, y + size * 0.22);
        ctx.fillText('☁️', x + size * 0.8, y + size * 0.25);
      } else if (th.draw === 'sunflower') {
        ctx.fillStyle = '#FFF8C0'; ctx.beginPath(); ctx.arc(cx, cy, size * 0.12, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#FFB23F';
        for (var p = 0; p < 12; p++) {
          var a = p / 12 * 6.28;
          ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * size * 0.22, cy + Math.sin(a) * size * 0.22, size * 0.09, size * 0.05, a, 0, 6.28); ctx.fill();
        }
        ctx.fillStyle = '#7A4A20'; ctx.beginPath(); ctx.arc(cx, cy, size * 0.09, 0, 6.28); ctx.fill();
      } else if (th.draw === 'night') {
        ctx.fillStyle = '#FFF';
        for (var s = 0; s < 20; s++) {
          var sx = x + ((s * 37) % size), sy = y + ((s * 53) % size);
          ctx.beginPath(); ctx.arc(sx, sy, s % 3 === 0 ? 2.5 : 1.5, 0, 6.28); ctx.fill();
        }
        ctx.font = '40px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🌙', cx, cy);
      } else if (th.draw === 'garden') {
        ctx.fillStyle = '#7CBF5E'; ctx.fillRect(x, y + size * 0.7, size, size * 0.3);
        ctx.font = '34px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('🌷', x + size * 0.3, y + size * 0.6);
        ctx.fillText('🌻', x + size * 0.7, y + size * 0.58);
        ctx.fillText('🦋', x + size * 0.5, y + size * 0.28);
      }
    }

    box.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (!running || over) return;
      var rect = cv.getBoundingClientRect();
      var px = (e.clientX - rect.left) / rect.width * W;
      var py = (e.clientY - rect.top) / rect.height * H;
      var startX = BX + BOARD + 20 + PAD, startY = BY;
      for (var i = 0; i < 9; i++) {
        var r = Math.floor(i / N), c = i % N;
        var x = startX + c * (CELL + GAP), y = startY + r * (CELL + GAP);
        if (px >= x && px <= x + CELL && py >= y && py <= y + CELL) { clickTile(i); break; }
      }
    });
    $('startBtn').addEventListener('click', start);
    $('againBtn').addEventListener('click', function () { reset(true); });
    $('shuffleBtn').addEventListener('click', function () { reset(true); });
    $('muteBtn').addEventListener('click', function () {
      var m = !A.isMuted(); A.setMuted(m); $('muteBtn').textContent = m ? '🔇 音效关' : '🔊 音效开';
    });

    reset();
    requestAnimationFrame(function (t) { lastTs = t; loop(t); });
  })();
  </script>
</body>
</html>
