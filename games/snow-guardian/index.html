<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雪花守护者 - 洪哥做的好耍小游戏</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="game-page">
  <div data-ad-slot="banner-top" class="ad-slot-wrap"></div>
  <div class="game-topbar">
    <a class="back-btn" href="../../index.html">← 返回游戏大厅</a>
    <div class="game-title">❄️ 雪花守护者</div>
  </div>

  <div class="arcade-wrap">
    <div class="arcade-hud">
      <div class="arcade-stat"><span class="lbl">送达</span><span class="val" id="delivered">0/8</span></div>
      <div class="arcade-stat combo"><span class="lbl">守护中</span><span class="val" id="holding">0</span></div>
      <div class="arcade-stat hi"><span class="lbl">落地</span><span class="val" id="dropped">0</span></div>
    </div>

    <div class="arcade-canvas-box" id="box">
      <canvas id="cv"></canvas>
      <div class="arcade-overlay show" id="startOv">
        <div class="arcade-panel">
          <div class="p-emoji">❄️</div>
          <h2>雪花守护者</h2>
          <p class="p-sub">飘落的雪花不能直接落地。用手指在雪花周围形成"暖区"——靠近指尖的雪花会被稳稳托住，跟着你的手指缓缓移动。把 8 片雪花一片片引导到下方的花苞上。落地超过 3 片就结束啦。</p>
          <button class="arcade-btn primary big" id="startBtn">开始守护</button>
        </div>
      </div>
      <div class="arcade-overlay" id="endOv">
        <div class="arcade-panel">
          <div class="p-emoji" id="endEmoji">🌸</div>
          <h2 id="endTitle">都送到啦！</h2>
          <div class="p-sub" id="endDesc">雪花在花苞上开出了美丽的花。</div>
          <button class="arcade-btn primary big" id="againBtn">再守护一次</button>
        </div>
      </div>
    </div>

    <div class="arcade-controls">
      <button class="arcade-btn" id="muteBtn">🔊 音效开</button>
    </div>
    <p class="arcade-tip">手指按住或移动，指尖周围会形成暖光区，托住附近雪花。带着雪花缓缓移到花苞上方，它会飘落进去。别让太多雪花落地。</p>
  </div>

  <div data-ad-slot="banner-bottom" class="ad-slot-wrap"></div>

  <script src="../../js/ads.js"></script>
  <script src="../../js/arcade-kit.js"></script>
  <script>
  (function () {
    'use strict';
    var A = window.Arcade;
    var W = 480, H = 560;
    var cv = document.getElementById('cv');
    var ctx = A.fitCanvas(cv, W, H);
    var box = document.getElementById('box');
    var $ = function (id) { return document.getElementById(id); };
    var FLOWER_X = W / 2, FLOWER_Y = H - 46, WARM_R = 74;
    var TOTAL = 8, MAX_DROP = 3;

    var flakes, finger, delivered, dropped, spawnTimer, spawnLeft, running, over,
        particles, floaters, lastTs, time, bloom, flowers, pointerMap;

    function resetAll() {
      flakes = []; finger = null; pointerMap = {};
      delivered = 0; dropped = 0; spawnLeft = TOTAL; spawnTimer = 0.4;
      running = false; over = false; time = 0; bloom = 0; flowers = [];
      particles = new A.Particles(); floaters = new A.Floaters();
      updateHud();
      $('endOv').classList.remove('show');
      $('startOv').classList.add('show');
    }
    function start() {
      $('startOv').classList.remove('show');
      running = true; lastTs = performance.now();
    }
    function updateHud() {
      $('delivered').textContent = delivered + '/' + TOTAL;
      $('holding').textContent = flakes.filter(function (f) { return f.held; }).length;
      $('dropped').textContent = dropped + '/' + MAX_DROP;
    }
    function spawnFlake() {
      flakes.push({ x: A.rand(50, W - 50), y: -14, vy: A.rand(28, 46), r: 11, held: false, spin: A.rand(0, 6.28), sway: A.rand(0, 6.28), ph: A.rand(0, 6.28) });
      spawnLeft--;
    }

    function drawFlake(x, y, r, spin) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(spin);
      ctx.shadowColor = '#BFE6FF'; ctx.shadowBlur = 12;
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      for (var i = 0; i < 6; i++) {
        var a = i / 6 * 6.28;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6);
        ctx.lineTo(Math.cos(a) * r * 0.6 + Math.cos(a + 0.7) * r * 0.28, Math.sin(a) * r * 0.6 + Math.sin(a + 0.7) * r * 0.28); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6);
        ctx.lineTo(Math.cos(a) * r * 0.6 + Math.cos(a - 0.7) * r * 0.28, Math.sin(a) * r * 0.6 + Math.sin(a - 0.7) * r * 0.28); ctx.stroke();
      }
      ctx.restore(); ctx.lineCap = 'butt';
      ctx.shadowBlur = 0;
    }

    function update(dt) {
      // 生成
      if (spawnLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) { spawnFlake(); spawnTimer = A.rand(1.2, 1.8); }
      }
      // 主手指位置（取任一活跃触点）
      var ids = Object.keys(pointerMap);
      finger = ids.length ? pointerMap[ids[0]] : null;

      for (var i = flakes.length - 1; i >= 0; i--) {
        var f = flakes[i];
        f.spin += dt * 0.6;
        // 判定暖区
        if (finger) {
          var d = Math.hypot(f.x - finger.x, f.y - finger.y);
          if (d < WARM_R) f.held = true;
        }
        if (f.held && finger) {
          // 跟随手指，略微悬停在指尖上方
          var tx = finger.x, ty = finger.y - 6;
          f.x += (tx - f.x) * Math.min(1, dt * 6);
          f.y += (ty - f.y) * Math.min(1, dt * 6);
          // 松开（无手指）则释放
          if (!finger) f.held = false;
        } else {
          // 自然飘落
          f.y += f.vy * dt;
          f.x += Math.sin(time * 1.4 + f.sway) * 16 * dt;
          f.held = false;
        }
        // 到达花苞
        if (f.y > FLOWER_Y - 26 && Math.abs(f.x - FLOWER_X) < 46) {
          flakes.splice(i, 1); delivered++; bloom = 1;
          flowers.push({ x: FLOWER_X + A.rand(-30, 30), y: FLOWER_Y - A.rand(0, 10), t: 0, c: ['#FF9DBB', '#FFD86B', '#A98BFF'][delivered % 3] });
          particles.burst(f.x, FLOWER_Y, { count: 14, colors: ['#FFFFFF', '#BFE6FF', '#FFD86B'], speedMax: 150, lifeMax: 0.8, gravity: 80 });
          floaters.add(f.x, FLOWER_Y - 20, '+1', '#FFD86B', 18);
          A.SFX.score(); A.vibrate(10);
          updateHud();
          continue;
        }
        // 落地
        if (f.y > H - 12) {
          flakes.splice(i, 1); dropped++;
          particles.burst(f.x, H - 8, { count: 10, colors: ['#FFFFFF', '#BFE6FF'], speedMax: 100, lifeMax: 0.5, gravity: 200 });
          A.SFX.fail();
          updateHud();
          if (dropped >= MAX_DROP) { endGame(false); return; }
          continue;
        }
      }
      if (delivered >= TOTAL) endGame(true);
      if (bloom > 0) bloom -= dt;
    }

    function endGame(win) {
      over = true; running = false;
      if (win) {
        A.SFX.win(); A.vibrate(35);
        $('endEmoji').textContent = '🌸';
        $('endTitle').textContent = '都送到啦！';
        $('endDesc').textContent = '8 片雪花安全落在花苞上，开出了漂亮的花。';
      } else {
        $('endEmoji').textContent = '❄️';
        $('endTitle').textContent = '雪花落地啦';
        $('endDesc').textContent = '落地的雪花有点多，再试一次，用指尖稳稳托住它们。';
      }
      $('endOv').classList.add('show');
    }

    function pointer(e) {
      var rect = cv.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / rect.width * W, y: (e.clientY - rect.top) / rect.height * H };
    }
    box.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (!running || over) return;
      pointerMap[e.pointerId] = pointer(e);
    });
    box.addEventListener('pointermove', function (e) {
      if (!pointerMap[e.pointerId]) return;
      pointerMap[e.pointerId] = pointer(e);
    });
    function release(e) { delete pointerMap[e.pointerId]; }
    box.addEventListener('pointerup', release);
    box.addEventListener('pointercancel', release);
    box.addEventListener('pointerleave', function (e) { delete pointerMap[e.pointerId]; });

    function draw() {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#1C2A52'); g.addColorStop(0.6, '#2E3A6E'); g.addColorStop(1, '#3E4A82');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // 月光
      ctx.fillStyle = 'rgba(255,240,200,.9)'; ctx.shadowColor = '#FFF0C8'; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(W - 66, 66, 22, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
      // 远雪
      ctx.fillStyle = 'rgba(200,220,255,.12)';
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(120, 360); ctx.lineTo(260, H); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(220, H); ctx.lineTo(360, 320); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      // 花苞底座
      ctx.fillStyle = '#5A4A3E';
      ctx.beginPath(); ctx.ellipse(FLOWER_X, FLOWER_Y + 26, 70, 16, 0, 0, 6.28); ctx.fill();
      ctx.strokeStyle = '#4FA86B'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(FLOWER_X, FLOWER_Y + 20); ctx.lineTo(FLOWER_X, FLOWER_Y - 6); ctx.stroke();
      ctx.fillStyle = '#FFB7CE';
      ctx.beginPath(); ctx.ellipse(FLOWER_X, FLOWER_Y - 12, 18, 22, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#FF8FB1';
      ctx.beginPath(); ctx.ellipse(FLOWER_X, FLOWER_Y - 18, 14, 14, 0, 0, 6.28); ctx.fill();
      // 已开的花
      for (var fl = 0; fl < flowers.length; fl++) {
        var fw = flowers[fl];
        ctx.fillStyle = fw.c; ctx.shadowColor = fw.c; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(fw.x, fw.y, 6, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
      }
      // 暖区光晕
      if (finger) {
        var wg = ctx.createRadialGradient(finger.x, finger.y, 6, finger.x, finger.y, WARM_R);
        wg.addColorStop(0, 'rgba(255,220,150,.35)'); wg.addColorStop(1, 'rgba(255,220,150,0)');
        ctx.fillStyle = wg;
        ctx.beginPath(); ctx.arc(finger.x, finger.y, WARM_R, 0, 6.28); ctx.fill();
        ctx.fillStyle = 'rgba(255,230,180,.9)';
        ctx.beginPath(); ctx.arc(finger.x, finger.y, 8, 0, 6.28); ctx.fill();
      }
      // 雪花
      for (var i = 0; i < flakes.length; i++) drawFlake(flakes[i].x, flakes[i].y, flakes[i].r, flakes[i].spin);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('指尖托住雪花 → 送到花苞', 14, 26);
      particles.draw(ctx); floaters.draw(ctx);
    }

    function loop(ts) {
      var dt = Math.min((ts - lastTs) / 1000 || 0, 0.033);
      lastTs = ts; time += dt;
      if (running && !over) update(dt);
      particles.update(dt); floaters.update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    $('startBtn').addEventListener('click', start);
    $('againBtn').addEventListener('click', function () { resetAll(); start(); });
    $('muteBtn').addEventListener('click', function () {
      var m = !A.isMuted(); A.setMuted(m); $('muteBtn').textContent = m ? '🔇 音效关' : '🔊 音效开';
    });

    resetAll();
    requestAnimationFrame(function (t) { lastTs = t; loop(t); });
  })();
  </script>
</body>
</html>
