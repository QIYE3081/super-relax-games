<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>元素进化2048 - 洪哥做的好耍小游戏</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="game-page">
  <div data-ad-slot="banner-top" class="ad-slot-wrap"></div>
  <div class="game-topbar">
    <a class="back-btn" href="../../index.html">← 返回游戏大厅</a>
    <div class="game-title">💧 元素进化2048</div>
  </div>

  <div class="arcade-wrap">
    <div class="arcade-hud">
      <div class="arcade-stat"><span class="lbl">得分</span><span class="val" id="score">0</span></div>
      <div class="arcade-stat combo"><span class="lbl">目标</span><span class="val" id="goal">🌊</span></div>
      <div class="arcade-stat hi"><span class="lbl">最高</span><span class="val" id="best">0</span></div>
    </div>

    <div class="arcade-canvas-box" id="box">
      <canvas id="cv"></canvas>
      <div class="arcade-overlay show" id="startOv">
        <div class="arcade-panel">
          <div class="p-emoji">💧</div>
          <h2>元素进化2048</h2>
          <p class="p-sub">滑动合并相同元素，一路进化：水滴→溪流→湖泊→大海→云朵→天空→彩虹！方向键或滑动操作，合成目标元素即通关。</p>
          <button class="arcade-btn primary big" id="startBtn">开始游戏</button>
        </div>
      </div>
      <div class="arcade-overlay" id="endOv">
        <div class="arcade-panel">
          <div class="p-emoji" id="endEmoji">🌈</div>
          <h2 id="endTitle">进化成功！</h2>
          <div class="p-score">本次得分 <b id="finalScore">0</b></div>
          <div id="newBest" class="p-new" style="display:none">🎉 新纪录！</div>
          <button class="arcade-btn primary big" id="againBtn">再来一局</button>
        </div>
      </div>
    </div>

    <div class="arcade-controls">
      <button class="arcade-btn" id="muteBtn">🔊 音效开</button>
      <button class="arcade-btn" id="resetBtn">↺ 重新开始</button>
    </div>
    <p class="arcade-tip">滑动或方向键移动，相同元素合并进化。水滴→溪流→湖泊→大海→云朵→天空→彩虹，合成彩虹即通关！</p>
  </div>

  <div data-ad-slot="banner-bottom" class="ad-slot-wrap"></div>

  <script src="../../js/ads.js"></script>
  <script src="../../js/arcade-kit.js"></script>
  <script>
  (function () {
    'use strict';
    var A = window.Arcade;
    var N = 4, PAD = 12, CELL = 84, GAP = 8;
    var SIZE = PAD * 2 + CELL * N + GAP * (N - 1);
    var W = SIZE, H = SIZE + 60;
    var cv = document.getElementById('cv');
    var ctx = A.fitCanvas(cv, W, H);
    var box = document.getElementById('box');
    var $ = function (id) { return document.getElementById(id); };

    // 元素进化链：2^n
    var ELEM = [
      { e: '💧', name: '水滴', c: '#7EC8FF' },
      { e: '💦', name: '溪流', c: '#4DA8FF' },
      { e: '🏞️', name: '湖泊', c: '#2E86DE' },
      { e: '🌊', name: '大海', c: '#1B5FB8' },
      { e: '☁️', name: '云朵', c: '#B8D8F0' },
      { e: '🌤️', name: '天空', c: '#7FB5E8' },
      { e: '🌈', name: '彩虹', c: '#FF9EC4' },
      { e: '✨', name: '星光', c: '#FFD84A' }
    ];
    var GOAL = 6; // 合成彩虹通关

    var grid, scores, best = A.Best.get('element2048');
    var running, over, lastTs, animTiles, particles, floaters, won;

    function reset() {
      grid = []; for (var r = 0; r < N; r++) { grid[r] = []; for (var c = 0; c < N; c++) grid[r][c] = 0; }
      scores = 0; running = false; over = false; won = false;
      animTiles = []; particles = new A.Particles(); floaters = new A.Floaters();
      addRandom(); addRandom();
      updateHud();
      $('endOv').classList.remove('show');
      $('startOv').classList.add('show');
    }
    function start() { $('startOv').classList.remove('show'); running = true; }
    function updateHud() {
      $('score').textContent = scores;
      $('goal').textContent = ELEM[GOAL].e;
      $('best').textContent = best;
    }
    function addRandom() {
      var empty = [];
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (grid[r][c] === 0) empty.push([r, c]);
      if (!empty.length) return;
      var cell = empty[A.randInt(0, empty.length - 1)];
      grid[cell[0]][cell[1]] = Math.random() < 0.9 ? 1 : 2;
      animTiles.push({ r: cell[0], c: cell[1], pop: 0 });
    }

    function move(dr, dc) {
      if (!running || over) return;
      var moved = false;
      var mergedThisMove = [];
      // 按方向确定遍历顺序
      var rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
      if (dr === 1) rows = [3, 2, 1, 0];
      if (dc === 1) cols = [3, 2, 1, 0];
      for (var ri = 0; ri < N; ri++) {
        for (var ci = 0; ci < N; ci++) {
          var r = rows[ri], c = cols[ci];
          var v = grid[r][c];
          if (v === 0) continue;
          var nr = r, nc = c;
          while (true) {
            var tr = nr + dr, tc = nc + dc;
            if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
            if (grid[tr][tc] === 0) { nr = tr; nc = tc; continue; }
            if (grid[tr][tc] === v && !mergedThisMove[tr + ',' + tc]) {
              // 合并
              grid[tr][tc] = v + 1;
              grid[r][c] = 0;
              mergedThisMove[tr + ',' + tc] = true;
              scores += Math.pow(2, v + 1) * 10;
              var pos = cellCenter(tr, tc);
              particles.burst(pos.x, pos.y, { count: 14, colors: [ELEM[Math.min(v + 1, ELEM.length - 1)].c, '#fff'], speedMax: 200 });
              floaters.add(pos.x, pos.y, ELEM[Math.min(v + 1, ELEM.length - 1)].e + ' ' + ELEM[Math.min(v + 1, ELEM.length - 1)].name, '#FFE066', 16);
              A.SFX.combo(v); A.vibrate(15);
              animTiles.push({ r: tr, c: tc, pop: 1 });
              moved = true;
              if (v + 1 >= GOAL) won = true;
            }
            break;
          }
          if (nr !== r || nc !== c) {
            grid[nr][nc] = grid[r][c]; grid[r][c] = 0;
            moved = true;
          }
        }
      }
      if (moved) {
        addRandom(); updateHud();
        if (won) setTimeout(function () { gameOver(true); }, 500);
        else if (!hasMoves()) gameOver(false);
      }
    }
    function hasMoves() {
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
        if (grid[r][c] === 0) return true;
        if (r < N - 1 && grid[r + 1][c] === grid[r][c]) return true;
        if (c < N - 1 && grid[r][c + 1] === grid[r][c]) return true;
      }
      return false;
    }
    function gameOver(win) {
      over = true; running = false;
      var isNew = scores > best;
      if (isNew) { best = scores; A.Best.set('element2048', best); }
      updateHud();
      $('finalScore').textContent = scores;
      $('endTitle').textContent = win ? '进化成彩虹！' : '没有位置了';
      $('endEmoji').textContent = win ? '🌈' : '💧';
      $('newBest').style.display = isNew ? 'inline-block' : 'none';
      $('endOv').classList.add('show');
      if (win) A.SFX.win(); else A.SFX.fail();
    }
    function cellCenter(r, c) {
      return { x: PAD + c * (CELL + GAP) + CELL / 2, y: PAD + r * (CELL + GAP) + CELL / 2 };
    }

    function loop(ts) {
      var dt = Math.min((ts - lastTs) / 1000 || 0, 0.033);
      lastTs = ts;
      for (var i = animTiles.length - 1; i >= 0; i--) {
        animTiles[i].pop = Math.min(1, animTiles[i].pop + dt * 4);
      }
      particles.update(dt); floaters.update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    function draw() {
      // 背景
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#1E3A6E'); g.addColorStop(1, '#2E5A8E');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // 标题
      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💧 元素进化 · 合出 ' + ELEM[GOAL].e + ' 彩虹通关', W / 2, H - 28);
      ctx.textBaseline = 'alphabetic';
      // 棋盘
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      A.roundRectPath(ctx, PAD - 6, PAD - 6, CELL * N + GAP * (N - 1) + 12, CELL * N + GAP * (N - 1) + 12, 16); ctx.fill();
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
        var x = PAD + c * (CELL + GAP), y = PAD + r * (CELL + GAP);
        ctx.fillStyle = 'rgba(255,255,255,.10)';
        A.roundRectPath(ctx, x, y, CELL, CELL, 12); ctx.fill();
      }
      // 元素块
      for (var rr = 0; rr < N; rr++) for (var cc = 0; cc < N; cc++) {
        var v = grid[rr][cc];
        if (v) drawTile(rr, cc, v);
      }
      particles.draw(ctx); floaters.draw(ctx);
    }
    function drawTile(r, c, v) {
      var pos = cellCenter(r, c);
      var el = ELEM[Math.min(v - 1, ELEM.length - 1)];
      // 动画缩放
      var scale = 1;
      var at = animTiles.filter(function (a) { return a.r === r && a.c === c; })[0];
      if (at) scale = 0.8 + 0.2 * at.pop + Math.sin(at.pop * Math.PI) * 0.12;
      var size = CELL * scale;
      var x = pos.x - size / 2, y = pos.y - size / 2;
      ctx.save();
      ctx.shadowColor = el.c; ctx.shadowBlur = 14;
      var g = ctx.createLinearGradient(x, y, x + size, y + size);
      g.addColorStop(0, A.shade(el.c, 0.4)); g.addColorStop(1, el.c);
      ctx.fillStyle = g;
      A.roundRectPath(ctx, x, y, size, size, 12); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = (size * 0.5) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(el.e, pos.x, pos.y);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText(el.name, pos.x, pos.y + size * 0.34);
      ctx.restore();
    }

    var touchStart = null;
    box.addEventListener('pointerdown', function (e) { touchStart = { x: e.clientX, y: e.clientY }; });
    box.addEventListener('pointerup', function (e) {
      if (!touchStart) return;
      var dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
      touchStart = null;
      if (Math.hypot(dx, dy) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
      else move(dy > 0 ? 1 : -1, 0);
    });
    window.addEventListener('keydown', function (e) {
      var map = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1] };
      var m = map[e.key];
      if (m) { e.preventDefault(); move(m[0], m[1]); }
    });
    $('startBtn').addEventListener('click', start);
    $('againBtn').addEventListener('click', reset);
    $('resetBtn').addEventListener('click', reset);
    $('muteBtn').addEventListener('click', function () {
      var m = !A.isMuted(); A.setMuted(m); $('muteBtn').textContent = m ? '🔇 音效关' : '🔊 音效开';
    });

    reset();
    requestAnimationFrame(function (t) { lastTs = t; loop(t); });
  })();
  </script>
</body>
</html>
