<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跳一跳 - 超级解压小游戏</title>
  <style>
/* ================= 超级解压小游戏 · v7 阳光明媚视觉 ================= */
:root {
  --ink: #2B3A55;
  --ink-soft: #7A8AA3;
  --card-bg: #FFFFFF;
  --radius: 24px;
  --shadow: 0 12px 34px rgba(80, 130, 180, .14);
  --shadow-hover: 0 24px 52px rgba(80, 130, 180, .24);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  color: var(--ink);
  background: #EAF6FF;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* 明快晴空背景（仅主页）：蓝天 + 暖阳 + 棉花糖云 */
body:not(.game-page)::before {
  content: ''; position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(600px 400px at 82% 6%, rgba(255,238,160,.85), transparent 62%),
    radial-gradient(700px 500px at 8% 12%, rgba(255,255,255,.7), transparent 60%),
    linear-gradient(165deg, #8FD3FF 0%, #B5E4FF 38%, #D9F0FF 70%, #FFF4DC 100%);
}
body:not(.game-page)::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(60px 24px at 15% 18%, rgba(255,255,255,.95), transparent 70%),
    radial-gradient(80px 30px at 78% 30%, rgba(255,255,255,.9), transparent 70%),
    radial-gradient(50px 20px at 40% 62%, rgba(255,255,255,.8), transparent 70%),
    radial-gradient(70px 28px at 88% 72%, rgba(255,255,255,.85), transparent 70%),
    radial-gradient(55px 22px at 8% 84%, rgba(255,255,255,.8), transparent 70%);
  animation: cloudFloat 30s ease-in-out infinite alternate;
}
@keyframes cloudFloat { from { transform: translateX(0); } to { transform: translateX(40px); } }

/* ---------- 顶部 ---------- */
.site-header {
  background: rgba(255, 255, 255, .82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 4px 20px rgba(90,150,200,.1);
  position: sticky; top: 0; z-index: 10;
}
.header-inner { max-width: 1080px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand-icon {
  font-size: 38px; width: 64px; height: 64px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #FFD86B, #FF9E5E);
  border-radius: 20px;
  box-shadow: 0 8px 22px rgba(255,158,94,.45), inset 0 2px 6px rgba(255,255,255,.5);
  animation: floaty 4s ease-in-out infinite;
}
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-7px) rotate(5deg); } }
.brand-text h1 {
  font-size: 29px; font-weight: 900; letter-spacing: 1px;
  background: linear-gradient(100deg, #3C7BD6 10%, #5AA9E6 50%, #FF9E5E 92%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand-text p { color: #7A8AA3; font-size: 13px; margin-top: 5px; font-weight: 600; letter-spacing: .5px; }
.header-badge {
  font-size: 12px; font-weight: 700; color: #E07B3A;
  background: rgba(255,220,150,.5); border: 1px solid rgba(255,190,110,.6);
  padding: 8px 14px; border-radius: 20px; white-space: nowrap;
}

/* ---------- 主体 ---------- */
.main-content { max-width: 1080px; margin: 0 auto; padding: 44px 24px 60px; }
.intro { text-align: center; margin-bottom: 28px; }
.intro .eyebrow {
  display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 3px;
  color: #E07B3A; text-transform: uppercase; margin-bottom: 12px;
}
.intro h2 {
  font-size: 34px; color: #2E4A6B; font-weight: 900; margin-bottom: 12px; line-height: 1.25;
  text-shadow: 0 3px 0 rgba(255,255,255,.9);
}
.intro h2 em { font-style: normal; background: linear-gradient(100deg, #FF8A5B, #FFC23C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.intro p { color: #6A7E96; font-size: 15px; font-weight: 600; }

/* 统计条 */
.stats-bar { display: flex; justify-content: center; gap: 34px; margin: 24px 0 28px; }
.stat-item { text-align: center; background: rgba(255,255,255,.78); padding: 12px 22px; border-radius: 18px; box-shadow: 0 6px 18px rgba(90,150,200,.12); }
.stat-item .num { font-size: 26px; font-weight: 900; color: #3C7BD6; line-height: 1; }
.stat-item .lab { font-size: 12px; color: #8A9BB0; margin-top: 6px; font-weight: 700; letter-spacing: 1px; }
.stat-sep { display: none; }

/* 分类筛选 */
.filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
.filter-btn {
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  color: #5A7091; background: rgba(255,255,255,.9);
  border: 1px solid rgba(120,170,220,.3); padding: 10px 20px; border-radius: 24px;
  transition: all .2s ease; box-shadow: 0 4px 12px rgba(90,150,200,.1);
}
.filter-btn:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 8px 18px rgba(90,150,200,.18); }
.filter-btn.active {
  color: #fff; border-color: transparent;
  background: linear-gradient(135deg, #4FA8F5, #3C7BD6);
  box-shadow: 0 8px 22px rgba(60,123,214,.4);
}
.filter-btn .cnt { font-size: 11px; opacity: .8; margin-left: 5px; }

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.game-card {
  display: block; text-decoration: none; color: inherit;
  position: relative;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(70, 120, 170, .16);
  transition: transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s ease;
  border: 1.5px solid #fff;
  animation: cardIn .45s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.game-card::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  border-radius: 14px;
  box-shadow: inset 0 0 0 0 var(--card-color);
  transition: box-shadow .28s ease;
}
.game-card:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 14px 30px rgba(70, 120, 170, .28), 0 0 18px color-mix(in srgb, var(--card-color) 35%, transparent);
}
.game-card:hover::before { box-shadow: inset 0 0 0 3px var(--card-color); }

.card-media {
  position: relative;
  height: 84px;
  background:
    radial-gradient(circle at 50% 28%, rgba(255,255,255,.95), transparent 68%),
    linear-gradient(160deg, color-mix(in srgb, var(--card-color) 42%, #fff), color-mix(in srgb, var(--card-color) 10%, #fff));
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-media::before {
  content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--card-color) 55%, transparent), transparent 70%);
  top: -30px; right: -24px; opacity: .6;
}
.card-media::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 80% 120%, rgba(255,255,255,.6), transparent 55%);
  pointer-events: none;
}
.card-thumb {
  width: 74px; height: 74px; object-fit: contain; position: relative; z-index: 1;
  filter: drop-shadow(0 6px 9px rgba(40,60,100,.26));
  transition: transform .32s cubic-bezier(.2,.8,.3,1);
}
.game-card:hover .card-thumb { transform: scale(1.13) rotate(-4deg); }
.card-icon {
  font-size: 40px; position: relative; z-index: 1;
  filter: drop-shadow(0 5px 7px rgba(0,0,0,.22));
  transition: transform .32s cubic-bezier(.2,.8,.3,1);
}
.game-card:hover .card-icon { transform: scale(1.16) rotate(-5deg); }
.card-num {
  position: absolute; top: 6px; left: 6px; z-index: 3;
  font-size: 9px; font-weight: 800; color: #fff;
  background: rgba(60,123,214,.82); backdrop-filter: blur(6px);
  padding: 3px 6px; border-radius: 9px; letter-spacing: .3px;
}
.card-badge {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  font-size: 9px; font-weight: 800; color: #fff;
  padding: 3px 6px; border-radius: 9px; letter-spacing: .3px;
  background: linear-gradient(135deg, #FF6B9D, #FF9E4A);
  box-shadow: 0 3px 8px rgba(255,107,157,.4);
}
.card-badge.hot { background: linear-gradient(135deg, #FF5B5B, #FF9E4A); }
.card-badge.classic { background: linear-gradient(135deg, #4DA8FF, #7B61FF); }
.card-play {
  position: absolute; right: 7px; bottom: 7px; z-index: 3;
  background: rgba(16,20,48,.82); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 5px 9px; border-radius: 14px;
  opacity: 0; transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
  backdrop-filter: blur(6px);
}
.game-card:hover .card-play { opacity: 1; transform: translateY(0); }
.card-body { padding: 9px 11px 11px; }
.card-body h3 { font-size: 13px; margin-bottom: 4px; font-weight: 900; color: #1E2A44; line-height: 1.25; }
.card-body p { color: var(--ink-soft); font-size: 10px; line-height: 1.45; min-height: 0;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.card-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: 9px; font-weight: 700;
  color: color-mix(in srgb, var(--card-color) 78%, #23324A);
  background: color-mix(in srgb, var(--card-color) 15%, #fff);
  padding: 3px 7px; border-radius: 12px;
}

.more-hint {
  text-align: center; margin-top: 48px; padding: 34px;
  background: rgba(255,255,255,.82);
  border-radius: var(--radius);
  border: 2px dashed rgba(120,170,220,.5);
}
.more-hint span { font-size: 34px; }
.more-hint p { color: #5A7091; margin-top: 10px; font-size: 15px; font-weight: 700; }

/* ---------- 页脚 ---------- */
.site-footer { text-align: center; padding: 26px; color: #7A8FA8; font-size: 12px; font-weight: 600; letter-spacing: .5px; }

/* ---------- 广告占位 ---------- */
.ad-slot-wrap { max-width: 1080px; margin: 12px auto; padding: 0 24px; }
.ad-placeholder {
  min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(255,255,255,.6); border: 1px dashed rgba(120,170,220,.4);
  border-radius: 10px; color: #9AAABB; font-size: 12px;
}
.ad-placeholder-tag { background: rgba(255,255,255,.8); color: #8A9BB0; padding: 2px 8px; border-radius: 4px; font-size: 11px; }

/* ================= 游戏页样式 ================= */
.game-page {
  background:
    radial-gradient(900px 500px at 15% 0%, rgba(255,255,255,.5), transparent 60%),
    linear-gradient(160deg, #DCEBFF 0%, #FBE6F0 100%);
}
.game-topbar { max-width: 720px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  color: #2E6FE8; font-size: 15px; font-weight: 700;
  background: #fff; padding: 10px 16px; border-radius: 12px;
  box-shadow: var(--shadow); transition: transform .15s ease;
}
.back-btn:hover { transform: translateX(-3px); }
.game-title { font-size: 21px; font-weight: 800; color: var(--ink); }

.game-stage { max-width: 720px; margin: 0 auto; padding: 0 20px 40px; text-align: center; }
.stage-panel {
  background: rgba(255,255,255,.92);
  border-radius: 24px; padding: 20px;
  box-shadow: var(--shadow);
  display: inline-block; width: 100%;
  border: 2px solid rgba(255,255,255,.9);
}
.progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 14px; color: var(--ink-soft); }
.face-tag {
  flex: none; font-size: 13px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #6A8DFB, #A78BFA);
  padding: 5px 12px; border-radius: 18px; white-space: nowrap;
}
.progress-bar { flex: 1; height: 16px; background: #E8EEF5; border-radius: 10px; overflow: hidden; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #5BD6A8, #3A7BD5);
  border-radius: 10px; transition: width .2s ease;
}
#gameCanvas {
  width: 100%; max-width: 520px; aspect-ratio: 1 / 1;
  border-radius: 18px;
  background: linear-gradient(180deg, #DCF0FF 0%, #F6FBEC 100%);
  cursor: crosshair; touch-action: none; display: block; margin: 0 auto;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.7);
}
.game-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.ctrl-btn {
  border: none; background: #fff; color: var(--ink);
  font-size: 14px; font-weight: 700; padding: 11px 18px;
  border-radius: 12px; box-shadow: var(--shadow); cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}
.ctrl-btn:hover { transform: translateY(-2px); background: #F0F6FF; }
.ctrl-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.ctrl-btn.primary:hover { filter: brightness(1.06); }
.game-tip { color: var(--ink-soft); font-size: 13px; margin-top: 14px; line-height: 1.6; }

/* 完成提示：底部小横条，不遮挡冲洗成果（物体完整可见，可翻面欣赏） */
.done-overlay {
  position: fixed; inset: 0;
  background: transparent;
  display: none; align-items: flex-end; justify-content: center;
  z-index: 50; pointer-events: none; padding-bottom: 14px;
}
.done-overlay.show { display: flex; animation: fadeIn .25s ease; }
.done-card {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,.95);
  border-radius: 16px; padding: 10px 14px;
  max-width: 94%; pointer-events: auto;
  box-shadow: 0 10px 30px rgba(40,60,100,.22);
  border: 1.5px solid rgba(255,255,255,.9);
  backdrop-filter: blur(8px);
  animation: slideUp .35s cubic-bezier(.2,1.2,.4,1);
}
.done-emoji { font-size: 28px; flex: none; }
.done-text { display: flex; flex-direction: column; line-height: 1.35; flex: 1; min-width: 96px; }
.done-text strong {
  font-size: 15px;
  background: linear-gradient(90deg, #6A8DFB, #C86BA8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.done-text span { color: var(--ink-soft); font-size: 12px; }
.done-actions { display: flex; gap: 8px; flex: none; }
.done-btn {
  border: none; font-size: 12px; font-weight: 700;
  padding: 8px 12px; border-radius: 10px; cursor: pointer; min-height: 36px;
  transition: transform .15s ease, filter .15s ease;
}
.done-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
.done-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.done-btn.ghost { background: #EEF3FB; color: #2E6FE8; }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ================= 移动端增强 ================= */
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.game-page .game-topbar { padding: 12px 14px; }
.game-page .game-stage { padding: 0 12px 24px; }
.game-page .stage-panel { padding: 14px 12px; border-radius: 18px; }
.ctrl-btn { min-height: 46px; padding: 10px 16px; font-size: 15px; }
.back-btn { min-height: 44px; }
.game-tip { font-size: 13px; padding: 0 6px; }
.face-tag { font-size: 12px; padding: 4px 9px; }
.progress-wrap { font-size: 12px; gap: 7px; }
.done-card { padding: 9px 12px; gap: 8px; max-width: 98%; }
.done-emoji { font-size: 24px; }
.done-text strong { font-size: 13px; }
.done-text span { font-size: 11px; }
.done-btn { font-size: 11px; padding: 7px 9px; min-height: 34px; }

@media (max-width: 600px) {
  .header-inner { padding: 14px 18px; }
  .brand-icon { width: 52px; height: 52px; font-size: 30px; border-radius: 16px; }
  .brand-text h1 { font-size: 21px; }
  .brand-text p { font-size: 11px; }
  .header-badge { display: none; }
  .main-content { padding: 30px 16px 44px; }
  .intro h2 { font-size: 25px; }
  .intro p { font-size: 13px; }
  .stats-bar { gap: 22px; margin: 20px 0 24px; }
  .stat-item .num { font-size: 21px; }
  .filter-bar { gap: 8px; margin-bottom: 24px; }
  .filter-btn { font-size: 12px; padding: 8px 14px; }
  .games-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .card-media { height: 72px; }
  .card-thumb { width: 62px; height: 62px; }
  .card-icon { font-size: 34px; }
}

/* ================= 街机类小游戏通用样式 ================= */
.arcade-wrap { max-width: 520px; margin: 0 auto; padding: 0 14px 34px; text-align: center; }
.arcade-hud {
  display: flex; align-items: stretch; gap: 8px; margin-bottom: 12px;
}
.arcade-stat {
  flex: 1; background: rgba(255,255,255,.9); border-radius: 14px;
  padding: 8px 6px; box-shadow: 0 6px 18px rgba(50,70,130,.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.arcade-stat .lbl { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
.arcade-stat .val { font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1.15; }
.arcade-stat.hi .val { color: #F0852A; }
.arcade-stat.combo .val { color: #E0457B; }
.arcade-canvas-box {
  position: relative; width: 100%; background: #fff;
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 14px 36px rgba(50,70,130,.2);
  border: 3px solid rgba(255,255,255,.85);
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
.arcade-canvas-box canvas { display: block; width: 100%; height: auto; }
.arcade-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.arcade-btn {
  min-height: 44px; padding: 10px 20px; border: none; border-radius: 24px;
  font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  background: #EEF3FB; color: #2E6FE8; transition: transform .15s, filter .15s;
}
.arcade-btn:hover { transform: translateY(-2px); filter: brightness(1.03); }
.arcade-btn:active { transform: scale(.96); }
.arcade-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.arcade-btn.big { min-height: 52px; font-size: 17px; padding: 12px 30px; }
.arcade-tip { color: #fff; font-size: 13px; font-weight: 500; margin-top: 14px; line-height: 1.6;
  text-shadow: 0 1px 6px rgba(40,50,110,.3); }

/* 开始/结束遮罩 */
.arcade-overlay {
  position: absolute; inset: 0; z-index: 20;
  display: none; align-items: center; justify-content: center;
  background: rgba(30,42,74,.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  padding: 18px;
}
.arcade-overlay.show { display: flex; animation: fadeIn .25s ease; }
.arcade-panel {
  background: #fff; border-radius: 22px; padding: 24px 22px; width: 100%; max-width: 340px;
  box-shadow: 0 18px 44px rgba(30,42,74,.32); animation: popIn .3s cubic-bezier(.2,.9,.3,1.2);
}
.arcade-panel .p-emoji { font-size: 50px; line-height: 1; }
.arcade-panel h2 { font-size: 23px; margin: 10px 0 6px; font-weight: 900; }
.arcade-panel .p-sub { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
.arcade-panel .p-score { font-size: 15px; color: var(--ink); margin: 12px 0; font-weight: 700; }
.arcade-panel .p-score b { font-size: 30px; color: #F0852A; }
.arcade-panel .p-new { display: inline-block; background: linear-gradient(135deg,#FFB020,#FF6B6B);
  color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 12px; margin-top: 6px; }
.arcade-panel .arcade-btn { width: 100%; margin-top: 8px; }

/* 难度选择（贪吃蛇） */
.level-picker { display: flex; gap: 8px; margin: 4px 0 14px; }
.level-btn {
  flex: 1; min-height: 42px; border: 2px solid #E2E9F5; border-radius: 12px;
  background: #F7FAFF; color: #5A6B84; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all .15s;
}
.level-btn:hover { border-color: #9DB8F5; }
.level-btn.active {
  background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff;
  border-color: transparent; box-shadow: 0 6px 16px rgba(106,141,251,.35);
}
.arcade-level-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin: -2px 2px 10px; padding: 0 4px;
  font-size: 13px; font-weight: 700; color: #fff;
  text-shadow: 0 1px 5px rgba(40,50,110,.3);
}

 */
(function (global) {
  'use strict';

  // ============ 全局配置：后期挂广告只改这里 ============
  var AD_CONFIG = {
    enabled: false,        // 总开关：false=不显示任何广告（当前）；true=显示广告位

  function renderSlot(el, slotName) {
    if (!AD_CONFIG.enabled) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';

    if (AD_CONFIG.showPlaceholder) {
      var info = AD_CONFIG.slots[slotName] || { label: slotName, size: '自适应' };

        '<span class="ad-placeholder-tag">广告</span>' +

    // }
  }

  function init() {
    var slots = document.querySelectorAll('[data-ad-slot]');
    for (var i = 0; i < slots.length; i++) {
      renderSlot(slots[i], slots[i].getAttribute('data-ad-slot'));
    }

  global.AdManager = {

  <script>
  (function () {
    'use strict';
    var A = window.Arcade;
    var W = 400, H = 600;
    var cv = document.getElementById('cv');
    var ctx = A.fitCanvas(cv, W, H);
    var box = document.getElementById('box');
    var $ = function (id) { return document.getElementById(id); };

    var score = 0, combo = 0, best = A.Best.get('jump');
    var state = 'ready'; // ready | charging | jumping | cam | falling | over
    var blocks = [], cur = 0;
    var pos = { x: 0, y: 0 };      // 角色世界坐标
    var cam = { x: 0, y: 0 };      // 镜头中心世界坐标
    var camFrom = { x: 0, y: 0 }, camTo = { x: 0, y: 0 }, camT = 0;
    var chargeStart = 0, power = 0;
    var jump = null;               // {sx,sy,tx,ty,t,dur,arc}
    var floaters = [];
    var clouds = [];
    var lastTs = 0;

    var COLORS = ['#6A8DFB', '#F0852A', '#37C9A8', '#E0457B', '#8B6BF0', '#F5B942', '#42B0E8'];
    var HALF = 34;

    function initClouds() {
      clouds = [];
      for (var i = 0; i < 7; i++) {

      }
    }

    function makeBlocks() {
      blocks = [];
      var x = 0, y = 0;
      for (var i = 0; i < 24; i++) {
        blocks.push({ x: x, y: y, c: COLORS[i % COLORS.length] });
        var d = A.rand(72, 148);
        var ang = A.rand(-0.22, 0.22); // 相对正前方的小角度偏移
        x += Math.sin(ang) * d + A.rand(-14, 14);
        y -= Math.cos(ang) * d;
      }
      cur = 0;
      pos = { x: blocks[0].x, y: blocks[0].y };
      cam = { x: blocks[0].x, y: blocks[0].y };
    }

    function reset() {
      score = 0; combo = 0;
      updateHud();
      makeBlocks();
      floaters = [];
      state = 'ready';
      $('endOv').classList.remove('show');
      $('startOv').classList.add('show');
    }

    function start() {
      $('startOv').classList.remove('show');
      state = 'idle';

      $('combo').textContent = combo;
      $('best').textContent = best;
    }

    // 屏幕坐标：世界坐标减去镜头，当前块固定在 (200, 430)
    function sx(wx) { return wx - cam.x + 200; }
    function sy(wy) { return wy - cam.y + 430; }

    function beginCharge() {
      if (state !== 'idle') return;
      state = 'charging';
      chargeStart = performance.now();
      A.SFX.tap();
    }

    function release() {
      if (state !== 'charging') return;
      var held = (performance.now() - chargeStart) / 1000;

      var phase = (held % 1.25) / 1.25;

        ctx.fillText('点我落点', x, y - 26);
      }
      if (isCur) {
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        poly([x, y - 17, x + HALF, y, x, y + 17, x - HALF, y]);
      }
    }

    function poly(pts) {
      ctx.beginPath();
      ctx.moveTo(pts[0], pts[1]);
      for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
      ctx.closePath();
      ctx.fill();
    }

    function shade(hex, amt) {
      var n = parseInt(hex.slice(1), 16);
      var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      var f = function (v) { return Math.round(A.clamp(amt > 0 ? v + (255 - v) * amt : v * (1 + amt), 0, 255)); };
      return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
    }

    function drawPlayer(px, py, scaleY, scaleX) {
      var x = sx(px), y = sy(py);
      // 影子
      ctx.fillStyle = 'rgba(30,40,70,.18)';
      ctx.beginPath();
      ctx.ellipse(x, y + 6, 20, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      // 身体（胶囊）
      var bw = 24 * (scaleX || 1), bh = 34 * (scaleY || 1);
      ctx.save();
      ctx.translate(x, y - bh / 2 + 4);
      var g = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
      g.addColorStop(0, '#FFB98A'); g.addColorStop(0.5, '#FF8A5B'); g.addColorStop(1, '#E86A3C');
      ctx.fillStyle = g;
      roundRect(-bw / 2, -bh / 2, bw, bh, 10);
      ctx.fill();
      // 眼睛
      ctx.fillStyle = '#3A2A22';
      ctx.beginPath(); ctx.arc(-6, -6, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -6, 2.6, 0, Math.PI * 2); ctx.fill();
      // 腮红
      ctx.fillStyle = 'rgba(255,120,120,.6)';
      ctx.beginPath(); ctx.arc(-10, 0, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(10, 0, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawBackground() {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#BFE3FF'); g.addColorStop(0.55, '#E8F3FF'); g.addColorStop(1, '#FBE9F0');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      // 云（视差）
      clouds.forEach(function (c) {
        var cx = ((c.x - cam.x * 0.06) % (W + 200) + (W + 200)) % (W + 200) - 100;
        var cy = ((c.y - cam.y * 0.03) % (H + 200) + (H + 200)) % (H + 200) - 100;
        ctx.fillStyle = 'rgba(255,255,255,' + c.a + ')';
        ctx.beginPath();
        ctx.arc(cx, cy, 20 * c.s, 0, Math.PI * 2);
        ctx.arc(cx + 18 * c.s, cy - 8 * c.s, 26 * c.s, 0, Math.PI * 2);
        ctx.arc(cx + 40 * c.s, cy, 18 * c.s, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawCharging() {
      var held = (performance.now() - chargeStart) / 1000;
      var phase = (held % 1.25) / 1.25;
      var p = phase < 0.5 ? phase * 2 : (1 - phase) * 2;
      power = A.clamp(p, 0, 1);
      // 力度条
      var bx = 40, by = H - 46, bw = W - 80;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      roundRect(bx, by, bw, 18, 9); ctx.fill();
      var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, '#6A8DFB'); g.addColorStop(0.7, '#F5B942'); g.addColorStop(1, '#E0457B');
      ctx.fillStyle = g;
      roundRect(bx + 2, by + 2, (bw - 4) * power, 14, 7); ctx.fill();
      ctx.fillStyle = '#5A6B84';
      ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('松手起跳', W / 2, by - 8);
    }

    function loop(ts) {
      var dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
      lastTs = ts;

      if (state === 'jumping' && jump) {
        jump.t += dt;
        var p = Math.min(jump.t / jump.dur, 1);
        var e = p; // 线性水平插值
        pos.x = jump.sx + (jump.tx - jump.sx) * e;
        pos.y = jump.sy + (jump.ty - jump.sy) * e;
        if (p >= 1) { pos.x = jump.tx; pos.y = jump.ty; land(); }
      } else if (state === 'cam') {
        camT += dt / 0.32;
        var k = Math.min(camT, 1);
        var ease = 1 - Math.pow(1 - k, 3);
        cam.x = camFrom.x + (camTo.x - camFrom.x) * ease;
        cam.y = camFrom.y + (camTo.y - camFrom.y) * ease;
        if (k >= 1) { cam.x = camTo.x; cam.y = camTo.y; state = 'idle'; }
      } else if (state === 'falling') {
        pos.y -= 40 * dt;
        pos.x += 60 * dt;
        if (!jump.fallT) jump.fallT = 0;
        jump.fallT += dt;
        if (jump.fallT > 0.7) gameOver();
      }

      drawBackground();
      for (var i = Math.max(0, cur - 1); i < Math.min(blocks.length, cur + 5); i++) {
        drawBlock(blocks[i], i === cur, i === cur + 1 && (state === 'idle' || state === 'charging'));
      }
      // 玩家
      var syScale = 1, sxScale = 1;
      if (state === 'charging') { syScale = 1 - power * 0.42; sxScale = 1 + power * 0.28; }
      if (state === 'jumping') { syScale = 1.14; sxScale = 0.92; }
      var lift = 0;
      if (state === 'jumping' && jump) {
        var pp = Math.min(jump.t / jump.dur, 1);
        lift = Math.sin(pp * Math.PI) * jump.arc;
      }
      var drawY = pos.y;
      if (lift) { // 用临时方式上抬：直接改 py 传入
        drawY = pos.y - lift / 1; // 视觉上抬
      }
      if (state === 'falling') { syScale = 1.2; sxScale = 0.85; }
      drawPlayer(pos.x, drawY, syScale, sxScale);

      if (state === 'charging') drawCharging();

      // 浮动文字（屏幕坐标固定，随相机漂移不影响）
      for (var f = floaters.length - 1; f >= 0; f--) {
        var fl = floaters[f];
        fl.life -= dt;
        fl.y -= 30 * dt;
        ctx.globalAlpha = A.clamp(fl.life, 0, 1);
        ctx.fillStyle = fl.color;
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(fl.text, fl.x, fl.y);
        ctx.globalAlpha = 1;
        if (fl.life <= 0) floaters.splice(f, 1);
      }

      requestAnimationFrame(loop);
    }

    // 输入
    box.addEventListener('pointerdown', function (e) {
      if (state === 'idle') { e.preventDefault(); beginCharge(); }
    });
    window.addEventListener('pointerup', function () { release(); });
    window.addEventListener('pointercancel', function () { release(); });

    $('startBtn').addEventListener('click', start);
    $('againBtn').addEventListener('click', reset);
    $('resetBtn').addEventListener('click', reset);
    $('muteBtn').addEventListener('click', function () {
      var m = !A.isMuted(); A.setMuted(m);
      $('muteBtn').textContent = m ? '🔇 音效关' : '🔊 音效开';
    });

    initClouds();
    reset();
    requestAnimationFrame(function (t) { lastTs = t; loop(t); });
  })();
  </script>
</body>
</html>
