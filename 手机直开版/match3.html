<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>羊了个羊 - 洪哥做的好耍小游戏</title>
  <style>
/* ================= 洪哥做的好耍小游戏 · v9 暖白墨蓝质感视觉 =================
   设计原则：60-30-10（暖白中性 60% / 墨蓝品牌 30% / 珊瑚强调 10%）
   字体：同一无衬线家族，靠字重 500/600/700/800 建立层级，不用渐变字
   ============================================================================ */
:root {
  --ink: #22304A;          /* 主文字：深墨蓝，对比度充足 */
  --ink-soft: #6B7A93;     /* 次文字：中灰蓝 */
  --paper: #FFFFFF;        /* 中性主色：白 */
  --brand: #2E4A7D;        /* 品牌色：墨蓝 */
  --brand-2: #3D5E96;      /* 品牌浅一档 */
  --accent: #EF7A52;       /* 强调色：珊瑚（仅用于关键处） */
  --line: #E6ECF5;         /* 描边 */
  --radius: 16px;
  --shadow: 0 6px 22px rgba(34, 48, 74, .07);
  --shadow-hover: 0 16px 38px rgba(34, 48, 74, .13);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: #F5F8FC;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 柔和纸质氛围（仅主页）：低饱和暖白 + 淡蓝灰，去掉棉花糖云 */
body:not(.game-page)::before {
  content: ''; position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(900px 600px at 88% -10%, rgba(93,130,190,.14), transparent 60%),
    radial-gradient(760px 520px at -8% 8%, rgba(239,122,82,.07), transparent 58%),
    linear-gradient(170deg, #FBFCFE 0%, #F4F7FB 46%, #EDF2F9 100%);
}
/* 极淡网点纹理，替代云朵装饰，避免幼稚感 */
body:not(.game-page)::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle, rgba(46,74,125,.055) 1px, transparent 1.5px);
  background-size: 26px 26px;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.55), transparent 62%);
  mask-image: linear-gradient(180deg, rgba(0,0,0,.55), transparent 62%);
}

/* ---------- 顶部 ---------- */
.site-header {
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(34,48,74,.03);
  position: sticky; top: 0; z-index: 10;
}
.header-inner { max-width: 1080px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  font-size: 30px; width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  background: var(--brand);
  border-radius: 15px;
  box-shadow: 0 6px 16px rgba(46,74,125,.24), inset 0 1px 0 rgba(255,255,255,.22);
  animation: floaty 5s ease-in-out infinite;
}
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.brand-text h1 {
  font-size: 25px; font-weight: 800; letter-spacing: -.4px;
  color: var(--ink); line-height: 1.25;
}
.brand-text p { color: var(--ink-soft); font-size: 12px; margin-top: 4px; font-weight: 500; letter-spacing: .3px; }
.header-badge {
  font-size: 12px; font-weight: 700; color: var(--brand);
  background: rgba(46,74,125,.06); border: 1px solid rgba(46,74,125,.13);
  padding: 8px 14px; border-radius: 20px; white-space: nowrap;
}

/* ---------- 主体 ---------- */
.main-content { max-width: 1080px; margin: 0 auto; padding: 40px 24px 60px; }
.intro { text-align: center; margin-bottom: 26px; }
.intro .eyebrow {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 4px;
  color: var(--accent); margin-bottom: 14px;
}
.intro h2 {
  font-size: 34px; color: var(--ink); font-weight: 800; margin-bottom: 12px; line-height: 1.3;
  letter-spacing: -.5px;
}
.intro h2 em { font-style: normal; color: var(--brand); }
.intro p { color: var(--ink-soft); font-size: 14px; font-weight: 500; }

/* 统计条 */
.stats-bar { display: flex; justify-content: center; gap: 14px; margin: 22px 0 26px; }
.stat-item { text-align: center; background: var(--paper); padding: 12px 24px; border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.stat-item .num { font-size: 25px; font-weight: 800; color: var(--brand); line-height: 1; }
.stat-item .lab { font-size: 11px; color: var(--ink-soft); margin-top: 6px; font-weight: 600; letter-spacing: 1px; }
.stat-sep { display: none; }

/* 分类筛选 */
.filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-bottom: 26px; }
.filter-btn {
  font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--ink-soft); background: var(--paper);
  border: 1px solid var(--line); padding: 9px 18px; border-radius: 22px;
  transition: all .2s ease; box-shadow: 0 2px 8px rgba(34,48,74,.04);
}
.filter-btn:hover { color: var(--brand); border-color: rgba(46,74,125,.3); transform: translateY(-2px); box-shadow: var(--shadow); }
.filter-btn.active {
  color: #fff; border-color: var(--brand);
  background: var(--brand);
  box-shadow: 0 6px 16px rgba(46,74,125,.26);
}
.filter-btn .cnt { font-size: 11px; opacity: .75; margin-left: 4px; }

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.game-card {
  display: block; text-decoration: none; color: inherit;
  position: relative;
  background: var(--paper);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s ease;
  border: 1px solid var(--line);
  animation: cardIn .45s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.game-card::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  border-radius: 14px;
  box-shadow: inset 0 0 0 0 var(--brand);
  transition: box-shadow .28s ease;
}
.game-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-hover);
}
.game-card:hover::before { box-shadow: inset 0 0 0 2px var(--brand); }

.card-media {
  position: relative;
  height: 84px;
  background: linear-gradient(160deg, #F8FAFD 0%, #EEF3FA 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-media::before {
  content: ''; position: absolute; width: 100px; height: 100px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--card-color) 16%, transparent), transparent 70%);
  top: -28px; right: -24px; opacity: .7;
}
.card-media::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 120%, rgba(255,255,255,.75), transparent 60%);
  pointer-events: none;
}
.card-thumb {
  width: 74px; height: 74px; object-fit: contain; position: relative; z-index: 1;
  filter: drop-shadow(0 6px 8px rgba(34,48,74,.16));
  transition: transform .32s cubic-bezier(.2,.8,.3,1);
}
.game-card:hover .card-thumb { transform: scale(1.1) rotate(-3deg); }
.card-icon {
  font-size: 40px; position: relative; z-index: 1;
  filter: drop-shadow(0 4px 6px rgba(34,48,74,.16));
  transition: transform .32s cubic-bezier(.2,.8,.3,1);
}
.game-card:hover .card-icon { transform: scale(1.12) rotate(-4deg); }
.card-num {
  position: absolute; top: 6px; left: 6px; z-index: 3;
  font-size: 9px; font-weight: 700; color: var(--brand);
  background: rgba(255,255,255,.9); border: 1px solid var(--line);
  padding: 3px 6px; border-radius: 9px; letter-spacing: .3px;
}
.card-badge {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  font-size: 9px; font-weight: 700; color: #fff;
  padding: 3px 6px; border-radius: 9px; letter-spacing: .3px;
  background: var(--brand-2);
}
.card-badge.hot { background: var(--accent); }
.card-badge.classic { background: #5A7091; }
.card-play {
  position: absolute; right: 7px; bottom: 7px; z-index: 3;
  background: var(--brand); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 5px 9px; border-radius: 14px;
  opacity: 0; transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
}
.game-card:hover .card-play { opacity: 1; transform: translateY(0); }
.card-body { padding: 9px 11px 11px; }
.card-body h3 { font-size: 13px; margin-bottom: 4px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.card-body p { color: var(--ink-soft); font-size: 10px; line-height: 1.45; min-height: 0;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.card-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: 9px; font-weight: 600;
  color: var(--brand-2); background: rgba(46,74,125,.07);
  padding: 3px 7px; border-radius: 12px;
}

.more-hint {
  text-align: center; margin-top: 40px; padding: 30px;
  background: var(--paper);
  border-radius: var(--radius);
  border: 1px dashed rgba(46,74,125,.25);
  box-shadow: var(--shadow);
}
.more-hint span { font-size: 30px; }
.more-hint p { color: var(--ink-soft); margin-top: 10px; font-size: 14px; font-weight: 600; }

/* ---------- 页脚 ---------- */
.site-footer { text-align: center; padding: 26px; color: var(--ink-soft); font-size: 11px; font-weight: 500; letter-spacing: .5px; }

/* ---------- 广告占位 ---------- */
.ad-slot-wrap { max-width: 1080px; margin: 12px auto; padding: 0 24px; }
.ad-placeholder {
  min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(255,255,255,.6); border: 1px dashed rgba(120,170,220,.4);
  border-radius: 10px; color: #9AAABB; font-size: 12px;
}
.ad-placeholder-tag { background: rgba(255,255,255,.8); color: #8A9BB0; padding: 2px 8px; border-radius: 4px; font-size: 11px; }

/* ================= 游戏页样式 ================= */
.game-page {
  background:
    radial-gradient(900px 500px at 15% 0%, rgba(255,255,255,.5), transparent 60%),
    linear-gradient(160deg, #DCEBFF 0%, #FBE6F0 100%);
}
.game-topbar { max-width: 720px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  color: #2E6FE8; font-size: 15px; font-weight: 700;
  background: #fff; padding: 10px 16px; border-radius: 12px;
  box-shadow: var(--shadow); transition: transform .15s ease;
}
.back-btn:hover { transform: translateX(-3px); }
.game-title { font-size: 21px; font-weight: 800; color: var(--ink); }

.game-stage { max-width: 720px; margin: 0 auto; padding: 0 20px 40px; text-align: center; }
.stage-panel {
  background: rgba(255,255,255,.92);
  border-radius: 24px; padding: 20px;
  box-shadow: var(--shadow);
  display: inline-block; width: 100%;
  border: 2px solid rgba(255,255,255,.9);
}
.progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 14px; color: var(--ink-soft); }
.face-tag {
  flex: none; font-size: 13px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #6A8DFB, #A78BFA);
  padding: 5px 12px; border-radius: 18px; white-space: nowrap;
}
.progress-bar { flex: 1; height: 16px; background: #E8EEF5; border-radius: 10px; overflow: hidden; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #5BD6A8, #3A7BD5);
  border-radius: 10px; transition: width .2s ease;
}
#gameCanvas {
  width: 100%; max-width: 520px; aspect-ratio: 1 / 1;
  border-radius: 18px;
  background: linear-gradient(180deg, #DCF0FF 0%, #F6FBEC 100%);
  cursor: crosshair; touch-action: none; display: block; margin: 0 auto;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.7);
}
.game-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.ctrl-btn {
  border: none; background: #fff; color: var(--ink);
  font-size: 14px; font-weight: 700; padding: 11px 18px;
  border-radius: 12px; box-shadow: var(--shadow); cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}
.ctrl-btn:hover { transform: translateY(-2px); background: #F0F6FF; }
.ctrl-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.ctrl-btn.primary:hover { filter: brightness(1.06); }
.game-tip { color: var(--ink-soft); font-size: 13px; margin-top: 14px; line-height: 1.6; }

/* 完成提示：底部小横条，不遮挡冲洗成果（物体完整可见，可翻面欣赏） */
.done-overlay {
  position: fixed; inset: 0;
  background: transparent;
  display: none; align-items: flex-end; justify-content: center;
  z-index: 50; pointer-events: none; padding-bottom: 14px;
}
.done-overlay.show { display: flex; animation: fadeIn .25s ease; }
.done-card {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,.95);
  border-radius: 16px; padding: 10px 14px;
  max-width: 94%; pointer-events: auto;
  box-shadow: 0 10px 30px rgba(40,60,100,.22);
  border: 1.5px solid rgba(255,255,255,.9);
  backdrop-filter: blur(8px);
  animation: slideUp .35s cubic-bezier(.2,1.2,.4,1);
}
.done-emoji { font-size: 28px; flex: none; }
.done-text { display: flex; flex-direction: column; line-height: 1.35; flex: 1; min-width: 96px; }
.done-text strong {
  font-size: 15px;
  background: linear-gradient(90deg, #6A8DFB, #C86BA8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.done-text span { color: var(--ink-soft); font-size: 12px; }
.done-actions { display: flex; gap: 8px; flex: none; }
.done-btn {
  border: none; font-size: 12px; font-weight: 700;
  padding: 8px 12px; border-radius: 10px; cursor: pointer; min-height: 36px;
  transition: transform .15s ease, filter .15s ease;
}
.done-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
.done-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.done-btn.ghost { background: #EEF3FB; color: #2E6FE8; }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ================= 移动端增强 ================= */
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.game-page .game-topbar { padding: 12px 14px; }
.game-page .game-stage { padding: 0 12px 24px; }
.game-page .stage-panel { padding: 14px 12px; border-radius: 18px; }
.ctrl-btn { min-height: 46px; padding: 10px 16px; font-size: 15px; }
.back-btn { min-height: 44px; }
.game-tip { font-size: 13px; padding: 0 6px; }
.face-tag { font-size: 12px; padding: 4px 9px; }
.progress-wrap { font-size: 12px; gap: 7px; }
.done-card { padding: 9px 12px; gap: 8px; max-width: 98%; }
.done-emoji { font-size: 24px; }
.done-text strong { font-size: 13px; }
.done-text span { font-size: 11px; }
.done-btn { font-size: 11px; padding: 7px 9px; min-height: 34px; }

@media (max-width: 600px) {
  .header-inner { padding: 14px 18px; }
  .brand-icon { width: 52px; height: 52px; font-size: 30px; border-radius: 16px; }
  .brand-text h1 { font-size: 21px; }
  .brand-text p { font-size: 11px; }
  .header-badge { display: none; }
  .main-content { padding: 30px 16px 44px; }
  .intro h2 { font-size: 25px; }
  .intro p { font-size: 13px; }
  .stats-bar { gap: 22px; margin: 20px 0 24px; }
  .stat-item .num { font-size: 21px; }
  .filter-bar { gap: 8px; margin-bottom: 24px; }
  .filter-btn { font-size: 12px; padding: 8px 14px; }
  .games-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .card-media { height: 72px; }
  .card-thumb { width: 62px; height: 62px; }
  .card-icon { font-size: 34px; }
}

/* ================= 街机类小游戏通用样式 ================= */
.arcade-wrap { max-width: 520px; margin: 0 auto; padding: 0 14px 34px; text-align: center; }
.arcade-hud {
  display: flex; align-items: stretch; gap: 8px; margin-bottom: 12px;
}
.arcade-stat {
  flex: 1; background: rgba(255,255,255,.9); border-radius: 14px;
  padding: 8px 6px; box-shadow: 0 6px 18px rgba(50,70,130,.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.arcade-stat .lbl { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
.arcade-stat .val { font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1.15; }
.arcade-stat.hi .val { color: #F0852A; }
.arcade-stat.combo .val { color: #E0457B; }
.arcade-canvas-box {
  position: relative; width: 100%; background: #fff;
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 14px 36px rgba(50,70,130,.2);
  border: 3px solid rgba(255,255,255,.85);
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
.arcade-canvas-box canvas { display: block; width: 100%; height: auto; }
.arcade-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.arcade-btn {
  min-height: 44px; padding: 10px 20px; border: none; border-radius: 24px;
  font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  background: #EEF3FB; color: #2E6FE8; transition: transform .15s, filter .15s;
}
.arcade-btn:hover { transform: translateY(-2px); filter: brightness(1.03); }
.arcade-btn:active { transform: scale(.96); }
.arcade-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.arcade-btn.big { min-height: 52px; font-size: 17px; padding: 12px 30px; }
.arcade-tip { color: #fff; font-size: 13px; font-weight: 500; margin-top: 14px; line-height: 1.6;
  text-shadow: 0 1px 6px rgba(40,50,110,.3); }

/* 开始/结束遮罩 */
.arcade-overlay {
  position: absolute; inset: 0; z-index: 20;
  display: none; align-items: center; justify-content: center;
  background: rgba(30,42,74,.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  padding: 18px;
}
.arcade-overlay.show { display: flex; animation: fadeIn .25s ease; }
.arcade-panel {
  background: #fff; border-radius: 22px; padding: 24px 22px; width: 100%; max-width: 340px;
  box-shadow: 0 18px 44px rgba(30,42,74,.32); animation: popIn .3s cubic-bezier(.2,.9,.3,1.2);
}
.arcade-panel .p-emoji { font-size: 50px; line-height: 1; }
.arcade-panel h2 { font-size: 23px; margin: 10px 0 6px; font-weight: 900; }
.arcade-panel .p-sub { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
.arcade-panel .p-score { font-size: 15px; color: var(--ink); margin: 12px 0; font-weight: 700; }
.arcade-panel .p-score b { font-size: 30px; color: #F0852A; }
.arcade-panel .p-new { display: inline-block; background: linear-gradient(135deg,#FFB020,#FF6B6B);
  color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 12px; margin-top: 6px; }
.arcade-panel .arcade-btn { width: 100%; margin-top: 8px; }

/* 难度选择（贪吃蛇） */
.level-picker { display: flex; gap: 8px; margin: 4px 0 14px; }
.level-btn {
  flex: 1; min-height: 42px; border: 2px solid #E2E9F5; border-radius: 12px;
  background: #F7FAFF; color: #5A6B84; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all .15s;
}
.level-btn:hover { border-color: #9DB8F5; }
.level-btn.active {
  background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff;
  border-color: transparent; box-shadow: 0 6px 16px rgba(106,141,251,.35);
}
.arcade-level-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin: -2px 2px 10px; padding: 0 4px;
  font-size: 13px; font-weight: 700; color: #fff;
  text-shadow: 0 1px 5px rgba(40,50,110,.3);
}
.arcade-level-bar .lv-speed { font-size: 12px; font-weight: 600; opacity: .92; }

/* 虚拟方向键（贪吃蛇用） */
.dpad { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 14px; }
.dpad-row { display: flex; gap: 6px; }
.dpad-key {

  <script>
/**
 * 广告位管理模块（全站共用）
 * ------------------------------------------------------------
 * 设计目标：现在不影响游戏体验，后期接入广告零改动页面。
 *
 * 使用方法：
 *   1. 在任意页面需要广告的地方写：<div data-ad-slot="banner-top"></div>
 *   2. 本脚本会自动扫描所有 [data-ad-slot] 并注入广告（或占位）。
 *
 * 后期接入真实广告（如百度联盟 / 穿山甲 / Google AdSense）：
 *   只需把 AD_CONFIG.enabled 设为 true，并在 renderSlot() 中
 *   按 slot 名称填入对应 SDK 代码即可，页面无需任何改动。
 */
(function (global) {
  'use strict';

  // ============ 全局配置：后期挂广告只改这里 ============
  var AD_CONFIG = {
    enabled: false,        // 总开关：false=不显示任何广告（当前）；true=显示广告位
    showPlaceholder: true, // enabled 时是否显示占位框（接入真实广告后设为 false）
    // 各广告位尺寸/说明，接入 SDK 时可据此选择广告规格
    slots: {
      'banner-top':    { label: '顶部横幅广告', size: '728×90 / 320×50' },
      'banner-bottom': { label: '底部横幅广告', size: '728×90 / 320×50' },
      'card-inline':   { label: '游戏列表信息流广告', size: '自适应' },
      'rewarded':      { label: '激励视频广告（通关后可看）', size: '视频' }
    }
  };

  /**
   * 渲染单个广告位。
   * 接入真实广告时，在此函数内按 slot 名称分支填入 SDK 代码。
   */
  function renderSlot(el, slotName) {
    if (!AD_CONFIG.enabled) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';

    if (AD_CONFIG.showPlaceholder) {
      var info = AD_CONFIG.slots[slotName] || { label: slotName, size: '自适应' };
      el.innerHTML =
        '<div class="ad-placeholder" title="后期接入广告的位置">' +
        '<span class="ad-placeholder-tag">广告</span>' +
        '<span>' + info.label + ' · ' + info.size + '</span>' +
        '</div>';
      return;
    }

    // ---- 后期接入真实广告 SDK 的位置 ----
    // 示例结构（按实际平台替换）：
    // if (slotName === 'banner-top') {
    //   // 百度联盟 / AdSense 代码片段
    // }
  }

  function init() {
    var slots = document.querySelectorAll('[data-ad-slot]');
    for (var i = 0; i < slots.length; i++) {
      renderSlot(slots[i], slots[i].getAttribute('data-ad-slot'));
    }
  }

  // 暴露给外部：允许运行时开启广告（如后台配置下发）
  global.AdManager = {
    config: AD_CONFIG,
    init: init,
    enable: function (showPlaceholder) {
      AD_CONFIG.enabled = true;
      AD_CONFIG.showPlaceholder = showPlaceholder !== false;
      init();
    },
    disable: function () {
      AD_CONFIG.enabled = false;
      init();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window);

  <script>
/**
 * 街机小游戏通用工具库（跳一跳/合成/三消/贪吃蛇/打砖块共用）
 * 提供：Web Audio 合成音效、最高分存储、Canvas 高清适配、震动/抖动反馈。
 * 零外部依赖，复制本文件即可复用。

(function (global) {
  'use strict';

  /* ---------- Web Audio 音效 ---------- */
  var ctx = null;
  var muted = false;

  function ac() {
    if (muted) return null;
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }
    }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }

  function tone(freq, dur, type, vol, delay, endFreq) {
    var a = ac(); if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.14, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }

  var SFX = {
    tap:   function () { tone(520, 0.07, 'sine', 0.10); },
    jump:  function () { tone(300, 0.18, 'triangle', 0.16, 0, 720); },
    land:  function () { tone(220, 0.12, 'sine', 0.18, 0, 150); },
    score: function () { tone(660, 0.09, 'sine', 0.12); tone(880, 0.12, 'sine', 0.12, 0.07); },
    eat:   function () { tone(480, 0.08, 'square', 0.09, 0, 640); },
    combo: function (n) { var f = 600 + (n || 1) * 90; tone(f, 0.1, 'sine', 0.13); tone(f * 1.25, 0.12, 'sine', 0.11, 0.06); },
    merge: function (lv) { var f = 320 + (lv || 1) * 60; tone(f, 0.14, 'triangle', 0.14, 0, f * 1.6); },
    fail:  function () { tone(400, 0.35, 'sawtooth', 0.14, 0, 120); },
    win:   function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.16, 'sine', 0.13, i * 0.1); }); },
    click: function () { tone(700, 0.05, 'sine', 0.08); }
  };

  function setMuted(v) { muted = !!v; }
  function isMuted() { return muted; }

  /* ---------- 最高分 ---------- */
  var Best = {
    get: function (key) {
      try { return parseInt(localStorage.getItem('sg_arcade_' + key) || '0', 10) || 0; }
      catch (e) { return 0; }
    },
    set: function (key, val) {
      try { localStorage.setItem('sg_arcade_' + key, String(val)); } catch (e) {}
    }
  };

  /* ---------- Canvas 高清适配 ----------
   * 逻辑坐标固定为 w×h，物理像素按 DPR 放大，CSS 宽度 100% 自适应。
   * 返回已 setTransform 的 2D context，绘图直接用 0..w / 0..h 逻辑坐标。
   */
  function fitCanvas(canvas, w, h) {
    var dpr = Math.min(global.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    var c = canvas.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return c;
  }

  /* ---------- 反馈 ---------- */
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 20); } catch (e) {} }
  function shake(el) {
    if (!el) return;
    el.style.transition = 'transform .06s';
    el.style.transform = 'translate(' + (Math.random() * 8 - 4) + 'px,' + (Math.random() * 8 - 4) + 'px)';
    setTimeout(function () { el.style.transform = ''; }, 90);
  }

  /* ---------- 数值 ---------- */
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ---------- 绘图工具 ---------- */
  function roundRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  // 颜色明暗调节：amt>0 变亮，amt<0 变暗。接受 #rrggbb 或 rgb()
  function shade(color, amt) {
    var r, g, b;
    if (color.charAt(0) === '#') {
      var n = parseInt(color.slice(1), 16);
      r = (n >> 16) & 255; g = (n >> 8) & 255; b = n & 255;
    } else {
      var m = color.match(/\d+/g);
      if (!m) return color;
      r = +m[0]; g = +m[1]; b = +m[2];
    }
    function f(v) { return Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt)); }
    return 'rgb(' + clamp(f(r), 0, 255) + ',' + clamp(f(g), 0, 255) + ',' + clamp(f(b), 0, 255) + ')';
  }
  // 发光文字
  function glowText(c, text, x, y, font, color, glow) {
    c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.shadowColor = glow || color; c.shadowBlur = 16;
    c.fillStyle = color; c.fillText(text, x, y);
    c.shadowBlur = 0;
  }

  /* ---------- 粒子系统 ---------- */
  function Particles() { this.list = []; }
  Particles.prototype.burst = function (x, y, opt) {
    opt = opt || {};
    var n = opt.count || 12;
    for (var i = 0; i < n; i++) {
      var a = opt.angle !== undefined ? opt.angle + rand(-0.6, 0.6) : rand(0, Math.PI * 2);
      var sp = rand(opt.speedMin || 60, opt.speedMax || 240);
      this.list.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rand(opt.lifeMin || 0.4, opt.lifeMax || 0.9),
        maxLife: 0,
        size: rand(opt.sizeMin || 3, opt.sizeMax || 8),
        color: Array.isArray(opt.colors) ? opt.colors[randInt(0, opt.colors.length - 1)] : (opt.color || '#fff'),
        gravity: opt.gravity === undefined ? 300 : opt.gravity,
        shape: opt.shape || 'circle'
      });
      this.list[this.list.length - 1].maxLife = this.list[this.list.length - 1].life;
    }
  };
  Particles.prototype.update = function (dt) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var p = this.list[i];
      p.life -= dt;
      p.vy += p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) this.list.splice(i, 1);
    }
  };
  Particles.prototype.draw = function (c) {
    for (var i = 0; i < this.list.length; i++) {
      var p = this.list[i];
      c.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      c.fillStyle = p.color;
      if (p.shape === 'rect') {
        c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      } else {
        c.beginPath(); c.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); c.fill();
      }
    }
    c.globalAlpha = 1;
  };
  Particles.prototype.clear = function () { this.list.length = 0; };

  // 浮动文字（得分飘字）
  function Floaters() { this.list = []; }
  Floaters.prototype.add = function (x, y, text, color, size) {
    this.list.push({ x: x, y: y, text: text, color: color || '#fff', size: size || 20, life: 1, maxLife: 1 });
  };
  Floaters.prototype.update = function (dt) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var f = this.list[i];
      f.life -= dt * 1.2; f.y -= 42 * dt;
      if (f.life <= 0) this.list.splice(i, 1);
    }
  };
  Floaters.prototype.draw = function (c) {
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (var i = 0; i < this.list.length; i++) {
      var f = this.list[i];
      c.globalAlpha = clamp(f.life / f.maxLife, 0, 1);
      c.font = 'bold ' + f.size + 'px sans-serif';
      c.shadowColor = f.color; c.shadowBlur = 10;
      c.fillStyle = f.color; c.fillText(f.text, f.x, f.y);
      c.shadowBlur = 0;
    }
    c.globalAlpha = 1;
  };
  Floaters.prototype.clear = function () { this.list.length = 0; };

  global.Arcade = {
    SFX: SFX, Best: Best, fitCanvas: fitCanvas,
    setMuted: setMuted, isMuted: isMuted,
    vibrate: vibrate, shake: shake,
    rand: rand, randInt: randInt, clamp: clamp, lerp: lerp,
    roundRectPath: roundRectPath, shade: shade, glowText: glowText,
    Particles: Particles, Floaters: Floaters
  };
})(window);

  <script>
  (function () {
    'use strict';
    var A = window.Arcade;
    var W = 400, H = 620;
    var cv = document.getElementById('cv');
    var ctx = A.fitCanvas(cv, W, H);
    var box = document.getElementById('box');
    var $ = function (id) { return document.getElementById(id); };

    var EMOJI = ['🐑', '🐷', '🐶', '🐱', '🐰', '🐼', '🐻', '🦊', '🐸', '🐵'];
    var CELL = 48;
    var SLOT_N = 7, SLOT_Y = 520, SLOT_X = 20, SLOT_GAP = 4;
    var SLOT_W = SLOT_N * CELL + (SLOT_N - 1) * SLOT_GAP;

    var tiles = [], slots = [], score = 0, combo = 0, best = A.Best.get('match3');
    var hints = 3, hintId = -1, hintT = 0, running = false, over = false, floaters = [];
    var lastTs = 0;

    function makeTiles() {
      // 三层错位堆叠，总数 60（20 组 × 3）
      var spots = [];
      var layers = [
        { cols: 6, rows: 5, x: 34, y: 58, layer: 0 },
        { cols: 5, rows: 4, x: 56, y: 80, layer: 1 },
        { cols: 5, rows: 2, x: 78, y: 102, layer: 2 }
      ];
      layers.forEach(function (L) {
        for (var r = 0; r < L.rows; r++) {
          for (var c = 0; c < L.cols; c++) {
            spots.push({ x: L.x + c * 52, y: L.y + r * 52, layer: L.layer });
          }
        }
      });
      // 打乱位置
      for (var i = spots.length - 1; i > 0; i--) {
        var j = A.randInt(0, i);
        var t = spots[i]; spots[i] = spots[j]; spots[j] = t;
      }
      // 图案：每组 3 个相同，共 20 组
      var kinds = [];
      for (var g = 0; g < 20; g++) {
        var k = A.randInt(0, EMOJI.length - 1);
        kinds.push(k, k, k);
      }
      for (var q = kinds.length - 1; q > 0; q--) {
        var p = A.randInt(0, q);
        var tmp = kinds[q]; kinds[q] = kinds[p]; kinds[p] = tmp;
      }
      tiles = spots.map(function (s, idx) {
        return { id: idx, x: s.x, y: s.y, layer: s.layer, kind: kinds[idx], removed: false, locked: false };
      });
      refreshLocked();
    }

    function refreshLocked() {
      var alive = tiles.filter(function (t) { return !t.removed; });
      alive.forEach(function (a) {
        a.locked = false;
        for (var i = 0; i < alive.length; i++) {
          var b = alive[i];
          if (b.layer <= a.layer) continue;
          var ox = Math.min(a.x + CELL, b.x + CELL) - Math.max(a.x, b.x);
          var oy = Math.min(a.y + CELL, b.y + CELL) - Math.max(a.y, b.y);
          if (ox > 8 && oy > 8) { a.locked = true; break; }
        }
      });
    }

    function reset() {
      score = 0; combo = 0; slots = []; hints = 3; hintId = -1; hintT = 0;
      over = false; running = false; floaters = [];
      makeTiles();
      updateHud();
      $('endOv').classList.remove('show');
      $('startOv').classList.add('show');
    }
    function start() { $('startOv').classList.remove('show'); running = true; }
    function updateHud() {
      $('score').textContent = score;
      $('best').textContent = best;
      $('remain').textContent = tiles.filter(function (t) { return !t.removed; }).length;
      $('hintLeft').textContent = hints;
    }

    function pick(tile) {
      if (!running || over || tile.removed || tile.locked) return;
      tile.removed = true;
      slots.push(tile.kind);
      A.SFX.click();
      A.vibrate(12);
      hintId = -1;

      // 三消检测
      var cnt = {};
      slots.forEach(function (k) { cnt[k] = (cnt[k] || 0) + 1; });
      var found = -1;
      for (var key in cnt) { if (cnt[key] >= 3) { found = parseInt(key, 10); break; } }
      if (found >= 0) {
        var removed = 0;
        slots = slots.filter(function (k) {
          if (k === found && removed < 3) { removed++; return false; }
          return true;
        });
        combo++;
        var gain = 30 + (combo - 1) * 10;
        score += gain;
        floaters.push({ x: W / 2, y: SLOT_Y - 24, text: '消除 +' + gain, life: 1.1 });
        A.SFX.combo(combo);
        A.vibrate(30);
      } else {
        combo = 0;
      }
      refreshLocked();
      updateHud();

      if (slots.length >= SLOT_N) { gameOver(false); return; }
      if (tiles.every(function (t) { return t.removed; }) && slots.length === 0) { gameOver(true); }
    }

    function useHint() {
      if (!running || over || hints <= 0) return;
      hints--;
      // 优先提示槽位里已有 2 个的同类
      var cnt = {};
      slots.forEach(function (k) { cnt[k] = (cnt[k] || 0) + 1; });
      var want = -1;
      for (var key in cnt) { if (cnt[key] === 2) { want = parseInt(key, 10); break; } }
      var cand = tiles.filter(function (t) { return !t.removed && !t.locked && (want < 0 || t.kind === want); });
      if (!cand.length) cand = tiles.filter(function (t) { return !t.removed && !t.locked; });
      if (cand.length) {
        hintId = cand[A.randInt(0, cand.length - 1)].id;
        hintT = 3;
        A.SFX.tap();
      }
      updateHud();
    }

    function gameOver(win) {
      over = true; running = false;
      var isNew = score > best;
      if (isNew) { best = score; A.Best.set('match3', best); }
      updateHud();
      $('finalScore').textContent = score;
      $('newBest').style.display = isNew ? 'inline-block' : 'none';
      $('endEmoji').textContent = win ? '🎉' : '😵';
      $('endTitle').textContent = win ? '全部消除！' : '槽位满啦';
      $('endOv').classList.add('show');
      if (win) A.SFX.win(); else A.SFX.fail();
    }

    function draw() {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#D9F0E4'); g.addColorStop(1, '#C4E8F5');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // 格子：按层级从低到高绘制，保证上层正确盖住下层（层次清晰的关键）
      var ordered = tiles.filter(function (t) { return !t.removed; });
      ordered.sort(function (a, b) { return a.layer - b.layer; });
      ordered.forEach(function (t) {
        drawTile(t.x, t.y, t.kind, t.layer, t.locked, t.id === hintId && hintT > 0);
      });
      // 槽位托盘
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      roundRect(SLOT_X - 8, SLOT_Y - 8, SLOT_W + 16, CELL + 16, 16); ctx.fill();
      for (var i = 0; i < SLOT_N; i++) {
        var x = SLOT_X + i * (CELL + SLOT_GAP);
        ctx.fillStyle = 'rgba(120,150,140,.16)';
        roundRect(x, SLOT_Y, CELL, CELL, 10); ctx.fill();
        if (i < slots.length) {
          drawTile(x, SLOT_Y, slots[i], 2, false, false);
        }
      }
      // 浮动文字
      for (var f = floaters.length - 1; f >= 0; f--) {
        var fl = floaters[f];
        fl.life -= 0.02; fl.y -= 0.4;
        ctx.globalAlpha = A.clamp(fl.life, 0, 1);
        ctx.fillStyle = '#E0457B'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(fl.text, fl.x, fl.y); ctx.globalAlpha = 1;
        if (fl.life <= 0) floaters.splice(f, 1);
      }
    }

    // 层级配色：越上层越亮、投影越重，实心不透明，层次一眼可辨
    var LAYER_STYLE = [
      { top: '#D9CBB0', bottom: '#B9A988', side: '#8F7F60', edge: '#8B7A58', ink: 'rgba(60,50,32,.55)' }, // 底层：暗、灰
      { top: '#F2E4C4', bottom: '#DCC79E', side: '#B69A6C', edge: '#B0925E', ink: 'rgba(60,50,32,.25)' }, // 中层：中亮
      { top: '#FFFDF6', bottom: '#F5E7C6', side: '#D9BE8B', edge: '#C9A568', ink: 'rgba(60,50,32,0)' }  // 顶层：最亮
    ];
    function drawTile(x, y, kind, layer, locked, hinted) {
      ctx.save();
      var st = LAYER_STYLE[layer] || LAYER_STYLE[0];
      var depth = 7; // 立体厚度
      // 投影：层级越高阴影越明显
      ctx.shadowColor = 'rgba(28,52,44,' + (0.18 + layer * 0.12) + ')';
      ctx.shadowBlur = 6 + layer * 4;
      ctx.shadowOffsetY = 4 + layer * 2;
      // 侧面厚度（实心深色）
      ctx.fillStyle = st.side;
      roundRect(x + 2, y + depth, CELL, CELL, 9); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      // 顶面（实心渐变，不使用透明）
      var g = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
      g.addColorStop(0, st.top); g.addColorStop(1, st.bottom);
      ctx.fillStyle = g;
      roundRect(x, y, CELL, CELL, 9); ctx.fill();
      // 边框
      ctx.strokeStyle = st.edge; ctx.lineWidth = 2;
      roundRect(x, y, CELL, CELL, 9); ctx.stroke();
      // 顶面高光条，强化立体感
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      roundRect(x + 5, y + 4, CELL - 10, 6, 3); ctx.fill();
      // 图案（实心，不透明；被压的底层用深色压暗表示）
      ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(EMOJI[kind], x + CELL / 2, y + CELL / 2 + 2);
      // 被压住的块覆盖一层实色蒙版（非透明），进一步区分"不可点"
      if (locked) {
        ctx.fillStyle = 'rgba(70,66,56,.28)';
        roundRect(x, y, CELL, CELL, 9); ctx.fill();
      }
      ctx.textBaseline = 'alphabetic';
      if (hinted) {
        ctx.strokeStyle = '#FF5B8A'; ctx.lineWidth = 3;
        ctx.shadowColor = '#FF5B8A'; ctx.shadowBlur = 12;
        roundRect(x - 1, y - 1, CELL + 2, CELL + 2, 10); ctx.stroke();
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function loop(ts) {
      var dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
      lastTs = ts;
      if (hintT > 0) { hintT -= dt; if (hintT <= 0) hintId = -1; }
      draw();
      requestAnimationFrame(loop);
    }

    box.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var rect = cv.getBoundingClientRect();
      var mx = (e.clientX - rect.left) / rect.width * W;
      var my = (e.clientY - rect.top) / rect.height * H;
      // 从最上层开始找可点的块
      var best2 = null;
      tiles.forEach(function (t) {
        if (t.removed || t.locked) return;
        if (mx >= t.x && mx <= t.x + CELL && my >= t.y && my <= t.y + CELL) {
          if (!best2 || t.layer > best2.layer) best2 = t;
        }
      });
      if (best2) pick(best2);
    });

    $('startBtn').addEventListener('click', start);
    $('againBtn').addEventListener('click', reset);
    $('resetBtn').addEventListener('click', reset);
    $('hintBtn').addEventListener('click', useHint);
    $('muteBtn').addEventListener('click', function () {
      var m = !A.isMuted(); A.setMuted(m);
      $('muteBtn').textContent = m ? '🔇 音效关' : '🔊 音效开';
    });

    reset();
    requestAnimationFrame(function (t) { lastTs = t; loop(t); });
  })();
  </script>
</body>
</html>
