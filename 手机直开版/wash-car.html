<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>高压洗车 - 洪哥做的好耍小游戏</title>
  <style>
/* ================= 洪哥做的好耍小游戏 · v9 暖白墨蓝质感视觉 =================
   设计原则：60-30-10（暖白中性 60% / 墨蓝品牌 30% / 珊瑚强调 10%）
   字体：同一无衬线家族，靠字重 500/600/700/800 建立层级，不用渐变字
   ============================================================================ */
:root {
  --ink: #22304A;          /* 主文字：深墨蓝，对比度充足 */
  --ink-soft: #6B7A93;     /* 次文字：中灰蓝 */
  --paper: #FFFFFF;        /* 中性主色：白 */
  --brand: #2E4A7D;        /* 品牌色：墨蓝 */
  --brand-2: #3D5E96;      /* 品牌浅一档 */
  --accent: #EF7A52;       /* 强调色：珊瑚（仅用于关键处） */
  --line: #E6ECF5;         /* 描边 */
  --radius: 16px;
  --shadow: 0 6px 22px rgba(34, 48, 74, .07);
  --shadow-hover: 0 16px 38px rgba(34, 48, 74, .13);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: #F5F8FC;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 柔和纸质氛围（仅主页）：低饱和暖白 + 淡蓝灰，去掉棉花糖云 */
body:not(.game-page)::before {
  content: ''; position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(900px 600px at 88% -10%, rgba(93,130,190,.14), transparent 60%),
    radial-gradient(760px 520px at -8% 8%, rgba(239,122,82,.07), transparent 58%),
    linear-gradient(170deg, #FBFCFE 0%, #F4F7FB 46%, #EDF2F9 100%);
}
/* 极淡网点纹理，替代云朵装饰，避免幼稚感 */
body:not(.game-page)::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle, rgba(46,74,125,.055) 1px, transparent 1.5px);
  background-size: 26px 26px;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.55), transparent 62%);
  mask-image: linear-gradient(180deg, rgba(0,0,0,.55), transparent 62%);
}

/* ---------- 顶部 ---------- */
.site-header {
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(34,48,74,.03);
  position: sticky; top: 0; z-index: 10;
}
.header-inner { max-width: 1080px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  font-size: 30px; width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  background: var(--brand);
  border-radius: 15px;
  box-shadow: 0 6px 16px rgba(46,74,125,.24), inset 0 1px 0 rgba(255,255,255,.22);
  animation: floaty 5s ease-in-out infinite;
}
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.brand-text h1 {
  font-size: 25px; font-weight: 800; letter-spacing: -.4px;
  color: var(--ink); line-height: 1.25;
}
.brand-text p { color: var(--ink-soft); font-size: 12px; margin-top: 4px; font-weight: 500; letter-spacing: .3px; }
.header-badge {
  font-size: 12px; font-weight: 700; color: var(--brand);
  background: rgba(46,74,125,.06); border: 1px solid rgba(46,74,125,.13);
  padding: 8px 14px; border-radius: 20px; white-space: nowrap;
}

/* ---------- 主体 ---------- */
.main-content { max-width: 1080px; margin: 0 auto; padding: 40px 24px 60px; }
.intro { text-align: center; margin-bottom: 26px; }
.intro .eyebrow {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 4px;
  color: var(--accent); margin-bottom: 14px;
}
.intro h2 {
  font-size: 34px; color: var(--ink); font-weight: 800; margin-bottom: 12px; line-height: 1.3;
  letter-spacing: -.5px;
}
.intro h2 em { font-style: normal; color: var(--brand); }
.intro p { color: var(--ink-soft); font-size: 14px; font-weight: 500; }

/* 统计条 */
.stats-bar { display: flex; justify-content: center; gap: 14px; margin: 22px 0 26px; }
.stat-item { text-align: center; background: var(--paper); padding: 12px 24px; border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.stat-item .num { font-size: 25px; font-weight: 800; color: var(--brand); line-height: 1; }
.stat-item .lab { font-size: 11px; color: var(--ink-soft); margin-top: 6px; font-weight: 600; letter-spacing: 1px; }
.stat-sep { display: none; }

/* 分类筛选 */
.filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-bottom: 26px; }
.filter-btn {
  font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--ink-soft); background: var(--paper);
  border: 1px solid var(--line); padding: 9px 18px; border-radius: 22px;
  transition: all .2s ease; box-shadow: 0 2px 8px rgba(34,48,74,.04);
}
.filter-btn:hover { color: var(--brand); border-color: rgba(46,74,125,.3); transform: translateY(-2px); box-shadow: var(--shadow); }
.filter-btn.active {
  color: #fff; border-color: var(--brand);
  background: var(--brand);
  box-shadow: 0 6px 16px rgba(46,74,125,.26);
}
.filter-btn .cnt { font-size: 11px; opacity: .75; margin-left: 4px; }

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.game-card {
  display: block; text-decoration: none; color: inherit;
  position: relative;
  background: var(--paper);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .28s cubic-bezier(.2,.8,.3,1), box-shadow .28s ease;
  border: 1px solid var(--line);
  animation: cardIn .45s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.game-card::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  border-radius: 14px;
  box-shadow: inset 0 0 0 0 var(--brand);
  transition: box-shadow .28s ease;
}
.game-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-hover);
}
.game-card:hover::before { box-shadow: inset 0 0 0 2px var(--brand); }

.card-media {
  position: relative;
  height: 84px;
  background: linear-gradient(160deg, #F8FAFD 0%, #EEF3FA 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-media::before {
  content: ''; position: absolute; width: 100px; height: 100px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--card-color) 16%, transparent), transparent 70%);
  top: -28px; right: -24px; opacity: .7;
}
.card-media::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 120%, rgba(255,255,255,.75), transparent 60%);
  pointer-events: none;
}
.card-thumb {
  width: 74px; height: 74px; object-fit: contain; position: relative; z-index: 1;
  filter: drop-shadow(0 6px 8px rgba(34,48,74,.16));
  transition: transform .32s cubic-bezier(.2,.8,.3,1);
}
.game-card:hover .card-thumb { transform: scale(1.1) rotate(-3deg); }
.card-icon {
  font-size: 40px; position: relative; z-index: 1;
  filter: drop-shadow(0 4px 6px rgba(34,48,74,.16));
  transition: transform .32s cubic-bezier(.2,.8,.3,1);
}
.game-card:hover .card-icon { transform: scale(1.12) rotate(-4deg); }
.card-num {
  position: absolute; top: 6px; left: 6px; z-index: 3;
  font-size: 9px; font-weight: 700; color: var(--brand);
  background: rgba(255,255,255,.9); border: 1px solid var(--line);
  padding: 3px 6px; border-radius: 9px; letter-spacing: .3px;
}
.card-badge {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  font-size: 9px; font-weight: 700; color: #fff;
  padding: 3px 6px; border-radius: 9px; letter-spacing: .3px;
  background: var(--brand-2);
}
.card-badge.hot { background: var(--accent); }
.card-badge.classic { background: #5A7091; }
.card-play {
  position: absolute; right: 7px; bottom: 7px; z-index: 3;
  background: var(--brand); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 5px 9px; border-radius: 14px;
  opacity: 0; transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
}
.game-card:hover .card-play { opacity: 1; transform: translateY(0); }
.card-body { padding: 9px 11px 11px; }
.card-body h3 { font-size: 13px; margin-bottom: 4px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.card-body p { color: var(--ink-soft); font-size: 10px; line-height: 1.45; min-height: 0;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.card-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: 9px; font-weight: 600;
  color: var(--brand-2); background: rgba(46,74,125,.07);
  padding: 3px 7px; border-radius: 12px;
}

.more-hint {
  text-align: center; margin-top: 40px; padding: 30px;
  background: var(--paper);
  border-radius: var(--radius);
  border: 1px dashed rgba(46,74,125,.25);
  box-shadow: var(--shadow);
}
.more-hint span { font-size: 30px; }
.more-hint p { color: var(--ink-soft); margin-top: 10px; font-size: 14px; font-weight: 600; }

/* ---------- 页脚 ---------- */
.site-footer { text-align: center; padding: 26px; color: var(--ink-soft); font-size: 11px; font-weight: 500; letter-spacing: .5px; }

/* ---------- 广告占位 ---------- */
.ad-slot-wrap { max-width: 1080px; margin: 12px auto; padding: 0 24px; }
.ad-placeholder {
  min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(255,255,255,.6); border: 1px dashed rgba(120,170,220,.4);
  border-radius: 10px; color: #9AAABB; font-size: 12px;
}
.ad-placeholder-tag { background: rgba(255,255,255,.8); color: #8A9BB0; padding: 2px 8px; border-radius: 4px; font-size: 11px; }

/* ================= 游戏页样式 ================= */
.game-page {
  background:
    radial-gradient(900px 500px at 15% 0%, rgba(255,255,255,.5), transparent 60%),
    linear-gradient(160deg, #DCEBFF 0%, #FBE6F0 100%);
}
.game-topbar { max-width: 720px; margin: 0 auto; padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  color: #2E6FE8; font-size: 15px; font-weight: 700;
  background: #fff; padding: 10px 16px; border-radius: 12px;
  box-shadow: var(--shadow); transition: transform .15s ease;
}
.back-btn:hover { transform: translateX(-3px); }
.game-title { font-size: 21px; font-weight: 800; color: var(--ink); }

.game-stage { max-width: 720px; margin: 0 auto; padding: 0 20px 40px; text-align: center; }
.stage-panel {
  background: rgba(255,255,255,.92);
  border-radius: 24px; padding: 20px;
  box-shadow: var(--shadow);
  display: inline-block; width: 100%;
  border: 2px solid rgba(255,255,255,.9);
}
.progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 14px; color: var(--ink-soft); }
.face-tag {
  flex: none; font-size: 13px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #6A8DFB, #A78BFA);
  padding: 5px 12px; border-radius: 18px; white-space: nowrap;
}
.progress-bar { flex: 1; height: 16px; background: #E8EEF5; border-radius: 10px; overflow: hidden; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #5BD6A8, #3A7BD5);
  border-radius: 10px; transition: width .2s ease;
}
#gameCanvas {
  width: 100%; max-width: 520px; aspect-ratio: 1 / 1;
  border-radius: 18px;
  background: linear-gradient(180deg, #DCF0FF 0%, #F6FBEC 100%);
  cursor: crosshair; touch-action: none; display: block; margin: 0 auto;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.7);
}
.game-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.ctrl-btn {
  border: none; background: #fff; color: var(--ink);
  font-size: 14px; font-weight: 700; padding: 11px 18px;
  border-radius: 12px; box-shadow: var(--shadow); cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}
.ctrl-btn:hover { transform: translateY(-2px); background: #F0F6FF; }
.ctrl-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.ctrl-btn.primary:hover { filter: brightness(1.06); }
.game-tip { color: var(--ink-soft); font-size: 13px; margin-top: 14px; line-height: 1.6; }

/* 完成提示：底部小横条，不遮挡冲洗成果（物体完整可见，可翻面欣赏） */
.done-overlay {
  position: fixed; inset: 0;
  background: transparent;
  display: none; align-items: flex-end; justify-content: center;
  z-index: 50; pointer-events: none; padding-bottom: 14px;
}
.done-overlay.show { display: flex; animation: fadeIn .25s ease; }
.done-card {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,.95);
  border-radius: 16px; padding: 10px 14px;
  max-width: 94%; pointer-events: auto;
  box-shadow: 0 10px 30px rgba(40,60,100,.22);
  border: 1.5px solid rgba(255,255,255,.9);
  backdrop-filter: blur(8px);
  animation: slideUp .35s cubic-bezier(.2,1.2,.4,1);
}
.done-emoji { font-size: 28px; flex: none; }
.done-text { display: flex; flex-direction: column; line-height: 1.35; flex: 1; min-width: 96px; }
.done-text strong {
  font-size: 15px;
  background: linear-gradient(90deg, #6A8DFB, #C86BA8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.done-text span { color: var(--ink-soft); font-size: 12px; }
.done-actions { display: flex; gap: 8px; flex: none; }
.done-btn {
  border: none; font-size: 12px; font-weight: 700;
  padding: 8px 12px; border-radius: 10px; cursor: pointer; min-height: 36px;
  transition: transform .15s ease, filter .15s ease;
}
.done-btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
.done-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.done-btn.ghost { background: #EEF3FB; color: #2E6FE8; }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ================= 移动端增强 ================= */
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.game-page .game-topbar { padding: 12px 14px; }
.game-page .game-stage { padding: 0 12px 24px; }
.game-page .stage-panel { padding: 14px 12px; border-radius: 18px; }
.ctrl-btn { min-height: 46px; padding: 10px 16px; font-size: 15px; }
.back-btn { min-height: 44px; }
.game-tip { font-size: 13px; padding: 0 6px; }
.face-tag { font-size: 12px; padding: 4px 9px; }
.progress-wrap { font-size: 12px; gap: 7px; }
.done-card { padding: 9px 12px; gap: 8px; max-width: 98%; }
.done-emoji { font-size: 24px; }
.done-text strong { font-size: 13px; }
.done-text span { font-size: 11px; }
.done-btn { font-size: 11px; padding: 7px 9px; min-height: 34px; }

@media (max-width: 600px) {
  .header-inner { padding: 14px 18px; }
  .brand-icon { width: 52px; height: 52px; font-size: 30px; border-radius: 16px; }
  .brand-text h1 { font-size: 21px; }
  .brand-text p { font-size: 11px; }
  .header-badge { display: none; }
  .main-content { padding: 30px 16px 44px; }
  .intro h2 { font-size: 25px; }
  .intro p { font-size: 13px; }
  .stats-bar { gap: 22px; margin: 20px 0 24px; }
  .stat-item .num { font-size: 21px; }
  .filter-bar { gap: 8px; margin-bottom: 24px; }
  .filter-btn { font-size: 12px; padding: 8px 14px; }
  .games-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .card-media { height: 72px; }
  .card-thumb { width: 62px; height: 62px; }
  .card-icon { font-size: 34px; }
}

/* ================= 街机类小游戏通用样式 ================= */
.arcade-wrap { max-width: 520px; margin: 0 auto; padding: 0 14px 34px; text-align: center; }
.arcade-hud {
  display: flex; align-items: stretch; gap: 8px; margin-bottom: 12px;
}
.arcade-stat {
  flex: 1; background: rgba(255,255,255,.9); border-radius: 14px;
  padding: 8px 6px; box-shadow: 0 6px 18px rgba(50,70,130,.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.arcade-stat .lbl { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
.arcade-stat .val { font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1.15; }
.arcade-stat.hi .val { color: #F0852A; }
.arcade-stat.combo .val { color: #E0457B; }
.arcade-canvas-box {
  position: relative; width: 100%; background: #fff;
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 14px 36px rgba(50,70,130,.2);
  border: 3px solid rgba(255,255,255,.85);
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
.arcade-canvas-box canvas { display: block; width: 100%; height: auto; }
.arcade-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.arcade-btn {
  min-height: 44px; padding: 10px 20px; border: none; border-radius: 24px;
  font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  background: #EEF3FB; color: #2E6FE8; transition: transform .15s, filter .15s;
}
.arcade-btn:hover { transform: translateY(-2px); filter: brightness(1.03); }
.arcade-btn:active { transform: scale(.96); }
.arcade-btn.primary { background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff; }
.arcade-btn.big { min-height: 52px; font-size: 17px; padding: 12px 30px; }
.arcade-tip { color: #fff; font-size: 13px; font-weight: 500; margin-top: 14px; line-height: 1.6;
  text-shadow: 0 1px 6px rgba(40,50,110,.3); }

/* 开始/结束遮罩 */
.arcade-overlay {
  position: absolute; inset: 0; z-index: 20;
  display: none; align-items: center; justify-content: center;
  background: rgba(30,42,74,.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  padding: 18px;
}
.arcade-overlay.show { display: flex; animation: fadeIn .25s ease; }
.arcade-panel {
  background: #fff; border-radius: 22px; padding: 24px 22px; width: 100%; max-width: 340px;
  box-shadow: 0 18px 44px rgba(30,42,74,.32); animation: popIn .3s cubic-bezier(.2,.9,.3,1.2);
}
.arcade-panel .p-emoji { font-size: 50px; line-height: 1; }
.arcade-panel h2 { font-size: 23px; margin: 10px 0 6px; font-weight: 900; }
.arcade-panel .p-sub { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
.arcade-panel .p-score { font-size: 15px; color: var(--ink); margin: 12px 0; font-weight: 700; }
.arcade-panel .p-score b { font-size: 30px; color: #F0852A; }
.arcade-panel .p-new { display: inline-block; background: linear-gradient(135deg,#FFB020,#FF6B6B);
  color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 12px; margin-top: 6px; }
.arcade-panel .arcade-btn { width: 100%; margin-top: 8px; }

/* 难度选择（贪吃蛇） */
.level-picker { display: flex; gap: 8px; margin: 4px 0 14px; }
.level-btn {
  flex: 1; min-height: 42px; border: 2px solid #E2E9F5; border-radius: 12px;
  background: #F7FAFF; color: #5A6B84; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all .15s;
}
.level-btn:hover { border-color: #9DB8F5; }
.level-btn.active {
  background: linear-gradient(135deg, #6A8DFB, #8B6BF0); color: #fff;
  border-color: transparent; box-shadow: 0 6px 16px rgba(106,141,251,.35);
}
.arcade-level-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin: -2px 2px 10px; padding: 0 4px;
  font-size: 13px; font-weight: 700; color: #fff;
  text-shadow: 0 1px 5px rgba(40,50,110,.3);
}
.arcade-level-bar .lv-speed { font-size: 12px; font-weight: 600; opacity: .92; }

/* 虚拟方向键（贪吃蛇用） */
.dpad { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 14px; }
.dpad-row { display: flex; gap: 6px; }
.dpad-key {

  <script>
/**
 * 广告位管理模块（全站共用）
 * ------------------------------------------------------------
 * 设计目标：现在不影响游戏体验，后期接入广告零改动页面。
 *
 * 使用方法：
 *   1. 在任意页面需要广告的地方写：<div data-ad-slot="banner-top"></div>
 *   2. 本脚本会自动扫描所有 [data-ad-slot] 并注入广告（或占位）。
 *
 * 后期接入真实广告（如百度联盟 / 穿山甲 / Google AdSense）：
 *   只需把 AD_CONFIG.enabled 设为 true，并在 renderSlot() 中
 *   按 slot 名称填入对应 SDK 代码即可，页面无需任何改动。
 */
(function (global) {
  'use strict';

  // ============ 全局配置：后期挂广告只改这里 ============
  var AD_CONFIG = {
    enabled: false,        // 总开关：false=不显示任何广告（当前）；true=显示广告位
    showPlaceholder: true, // enabled 时是否显示占位框（接入真实广告后设为 false）
    // 各广告位尺寸/说明，接入 SDK 时可据此选择广告规格
    slots: {
      'banner-top':    { label: '顶部横幅广告', size: '728×90 / 320×50' },
      'banner-bottom': { label: '底部横幅广告', size: '728×90 / 320×50' },
      'card-inline':   { label: '游戏列表信息流广告', size: '自适应' },
      'rewarded':      { label: '激励视频广告（通关后可看）', size: '视频' }
    }
  };

  /**
   * 渲染单个广告位。
   * 接入真实广告时，在此函数内按 slot 名称分支填入 SDK 代码。
   */
  function renderSlot(el, slotName) {
    if (!AD_CONFIG.enabled) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';

    if (AD_CONFIG.showPlaceholder) {
      var info = AD_CONFIG.slots[slotName] || { label: slotName, size: '自适应' };
      el.innerHTML =
        '<div class="ad-placeholder" title="后期接入广告的位置">' +
        '<span class="ad-placeholder-tag">广告</span>' +
        '<span>' + info.label + ' · ' + info.size + '</span>' +
        '</div>';
      return;
    }

    // ---- 后期接入真实广告 SDK 的位置 ----
    // 示例结构（按实际平台替换）：
    // if (slotName === 'banner-top') {
    //   // 百度联盟 / AdSense 代码片段
    // }
  }

  function init() {
    var slots = document.querySelectorAll('[data-ad-slot]');
    for (var i = 0; i < slots.length; i++) {
      renderSlot(slots[i], slots[i].getAttribute('data-ad-slot'));
    }
  }

  // 暴露给外部：允许运行时开启广告（如后台配置下发）
  global.AdManager = {
    config: AD_CONFIG,
    init: init,
    enable: function (showPlaceholder) {
      AD_CONFIG.enabled = true;
      AD_CONFIG.showPlaceholder = showPlaceholder !== false;
      init();
    },
    disable: function () {
      AD_CONFIG.enabled = false;
      init();
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window);

</script>
  <script>
/**
 * 高压冲洗小游戏引擎 v3
 * ------------------------------------------------------------
 * 视觉：真实 3D 素材图，正/反两面。净图作底，脏图为可擦除上层。
 * 交互：水龙头固定在右下角；按住水龙头出水、松开停；水流为射线，
 *       可冲到被冲洗物之外；按住时移动鼠标/手指控制水龙头方向。
 *       点"翻面"旋转物体，轮流冲洗两面；两面都洗净才完成。
 *
 * config:
 *   canvasId, progressFillId, progressTextId, flipBtnId, muteBtnId,
 *   doneOverlayId, thanksTextId, doneEmojiId,
 *   sides: [{clean, dirty}, {clean, dirty}],  brush, thanks, doneEmoji, onComplete
 */
(function (global) {
  'use strict';

  var R = 560;
  var DPR = Math.min(global.devicePixelRatio || 1, 2);
  var TAU = Math.PI * 2;

  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // ---------- 音效 ----------
  function AudioKit() {
    this.ctx = null; this.muted = false; this.waterGain = null; this.waterSrc = null;
  }
  AudioKit.prototype._ensure = function () {
    if (this.ctx) return;
    var AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    var len = this.ctx.sampleRate * 2;
    var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
  };
  AudioKit.prototype.resume = function () {
    this._ensure();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  };
  AudioKit.prototype.startWater = function () {
    this.resume();
    if (!this.ctx || this.muted || this.waterSrc) return;
    var src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    var bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.6;
    var g = this.ctx.createGain(); g.gain.value = 0.0001;
    src.connect(bp); bp.connect(g); g.connect(this.ctx.destination);
    src.start();
    g.gain.exponentialRampToValueAtTime(0.13, this.ctx.currentTime + 0.1);
    this.waterSrc = src; this.waterGain = g;
  };
  AudioKit.prototype.stopWater = function () {
    if (!this.waterSrc || !this.ctx) return;
    var src = this.waterSrc, g = this.waterGain;
    try {
      g.gain.cancelScheduledValues(this.ctx.currentTime);
      g.gain.setValueAtTime(g.gain.value, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.12);
      src.stop(this.ctx.currentTime + 0.14);
    } catch (e) {}
    this.waterSrc = null; this.waterGain = null;
  };
  AudioKit.prototype.success = function () {
    this.resume();
    if (!this.ctx || this.muted) return;
    var self = this;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      var o = self.ctx.createOscillator(), g = self.ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      var t = self.ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(self.ctx.destination);
      o.start(t); o.stop(t + 0.4);
    });
  };
  AudioKit.prototype.toggleMute = function () {
    this.muted = !this.muted;
    if (this.muted) this.stopWater();
    return this.muted;
  };

  // ---------- 主引擎 ----------
  function create(config) {
    var canvas = $(config.canvasId);
    if (!canvas) { console.error('CleanWash: canvas not found', config.canvasId); return null; }
    var ctx = canvas.getContext('2d');
    canvas.width = R * DPR; canvas.height = R * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var audio = new AudioKit();

    var TAP_X = R - 62, TAP_Y = R - 62;   // 水龙头中心（右下角固定）
    var TAP_R = 56;                        // 水龙头可点击半径

    var state = {
      side: 0,                 // 当前面 0/1
      flip: 0,                 // 翻面动画进度 0..1
      flipping: false,
      spraying: false,
      aimX: R * 0.42, aimY: R * 0.4,
      particles: [], droplets: [], mists: [], confetti: [],
      t: 0, lastTs: 0,
      brush: config.brush || 26,
      done: false, doneAt: 0,
      ready: false
    };

    function makeSide(cfg) {
      var c = document.createElement('canvas');
      c.width = R * DPR; c.height = R * DPR;
      var cc = c.getContext('2d', { willReadFrequently: true });
      cc.setTransform(DPR, 0, 0, DPR, 0, 0);
      return { canvas: c, ctx: cc, clean: null, dirty: null, cfg: cfg,
               initialDirt: 1, progress: 0, doneAt: 0 };
    }
    var sides = [makeSide(config.sides[0]), makeSide(config.sides[1])];

    function loadImage(src) {
      return new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = function () { rej(new Error('图片加载失败: ' + src)); };
        im.src = src;
      });
    }

    function buildSide(sd) {
      sd.ctx.save();
      sd.ctx.setTransform(1, 0, 0, 1, 0, 0);
      sd.ctx.clearRect(0, 0, sd.canvas.width, sd.canvas.height);
      sd.ctx.restore();
      if (sd.dirty) sd.ctx.drawImage(sd.dirty, 0, 0, R, R);
      sd.initialDirt = countDirt(sd.ctx);
      sd.progress = 0;
      updateProgressUI();
    }
    function countDirt(cc) {
      var img = cc.getImageData(0, 0, R * DPR, R * DPR).data;
      var count = 0, step = 4 * DPR;
      for (var y = 0; y < R * DPR; y += step)
        for (var x = 0; x < R * DPR; x += step)
          if (img[(y * R * DPR + x) * 4 + 3] > 40) count++;
      return Math.max(count, 1);
    }
    function measureClean(sd) {
      var img = sd.ctx.getImageData(0, 0, R * DPR, R * DPR).data;
      var count = 0, step = 4 * DPR;
      for (var y = 0; y < R * DPR; y += step)
        for (var x = 0; x < R * DPR; x += step)
          if (img[(y * R * DPR + x) * 4 + 3] > 40) count++;
      return 1 - count / sd.initialDirt;
    }

    // 沿射线擦除：从水龙头口射向 aim，贯穿并延伸到画布外
    function eraseRay(sd) {
      var ox = TAP_X, oy = TAP_Y;
      var dx = state.aimX - ox, dy = state.aimY - oy;
      var len = Math.hypot(dx, dy) || 1;
      var ux = dx / len, uy = dy / len;
      var reach = Math.hypot(R, R) * 1.4;   // 射程足够远，冲出画布
      var steps = Math.ceil(reach / (state.brush * 0.35));
      sd.ctx.save();
      sd.ctx.globalCompositeOperation = 'destination-out';
      for (var i = 0; i <= steps; i++) {
        var d = i * state.brush * 0.35;
        var x = ox + ux * d, y = oy + uy * d;
        var g = sd.ctx.createRadialGradient(x, y, state.brush * 0.2, x, y, state.brush);
        // 顽固污垢：每次只擦除一小部分，需持续冲洗约3秒以上才逐渐干净
        g.addColorStop(0, 'rgba(0,0,0,0.10)');
        g.addColorStop(0.6, 'rgba(0,0,0,0.07)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        sd.ctx.fillStyle = g;
        sd.ctx.beginPath(); sd.ctx.arc(x, y, state.brush, 0, TAU); sd.ctx.fill();
      }
      sd.ctx.restore();
      // 沿整条射流生成水雾微粒，营造真实水流质感
      for (var k = 0; k < 8; k++) {
        var dd = rand(20, Math.min(reach * 0.75, R * 1.2));
        spawnMist(ox + ux * dd, oy + uy * dd, ux, uy);
      }
      // 命中物体区域时溅起水花
      if (len > 40) {
        for (var k2 = 0; k2 < 2; k2++) spawnSplash(ox + ux * Math.min(len, R), oy + uy * Math.min(len, R));
      }
    }
    function spawnMist(x, y, ux, uy) {
      state.mists.push({
        x: x + rand(-6, 6), y: y + rand(-6, 6),
        vx: ux * rand(1, 4) + rand(-1.2, 1.2),
        vy: uy * rand(1, 4) + rand(-1.2, 1.2),
        r: rand(0.8, 2.6), life: 1, decay: rand(0.05, 0.1)
      });
      if (state.mists.length > 260) state.mists.splice(0, state.mists.length - 260);
    }

    function spawnSplash(sx, sy) {
      state.particles.push({
        x: sx, y: sy, vx: rand(-2.6, 2.6), vy: rand(-3.6, -0.6),
        r: rand(1.5, 4.2), life: 1, decay: rand(0.025, 0.05)
      });
      if (state.particles.length > 320) state.particles.splice(0, state.particles.length - 320);
      if (Math.random() < 0.4) {
        state.droplets.push({ x: sx, y: sy, life: 1 });
        if (state.droplets.length > 50) state.droplets.shift();
      }
    }
    function spawnConfetti() {
      var colors = ['#FF6B8A', '#FFD166', '#5BD6A8', '#7FC8F8', '#C7A7F7'];
      for (var i = 0; i < 110; i++) {
        state.confetti.push({
          x: rand(0, R), y: rand(-R * 0.6, 0),
          vx: rand(-1.4, 1.4), vy: rand(1.4, 4.2),
          w: rand(6, 12), h: rand(9, 18), rot: rand(0, TAU), vr: rand(-0.16, 0.16),
          color: colors[i % colors.length], heart: i % 4 === 0
        });
      }
    }

    function updateAim(clientX, clientY) {
      var rect = canvas.getBoundingClientRect();
      var px = clamp((clientX - rect.left) / rect.width * R, -R, R * 2);
      var py = clamp((clientY - rect.top) / rect.height * R, -R, R * 2);
      // 限制扫动范围：水龙头在右下角，水流只能朝画面内部的左上90°扇形
      // （沿右边界向上 -90° ~ 沿下边界向左 180°/-180°）
      var dx = px - TAP_X, dy = py - TAP_Y;
      var ang = Math.atan2(dy, dx); // -π..π
      // 目标扇形：角度在 [-π, -π/2]（左上象限，dy<0 且 dx<0）
      ang = clamp(ang, -Math.PI, -Math.PI / 2);
      var dist = Math.hypot(dx, dy) || 1;
      state.aimX = TAP_X + Math.cos(ang) * dist;
      state.aimY = TAP_Y + Math.sin(ang) * dist;
    }
    // 当前射流的单位方向与角度（供水柱/水龙头/擦除共用一致朝向）
    function flowDir() {
      var dx = state.aimX - TAP_X, dy = state.aimY - TAP_Y;
      var len = Math.hypot(dx, dy);
      if (len < 5) { dx = -1; dy = -1; len = Math.SQRT2; } // 默认朝画面左上
      return { ux: dx / len, uy: dy / len, ang: Math.atan2(dy, dx), len: len };
    }

    function startSpray() {
      if (state.done || !state.ready || state.flipping) return;
      audio.resume(); state.spraying = true; audio.startWater();
    }
    function stopSpray() {
      if (!state.spraying) return;
      state.spraying = false; audio.stopWater(); maybeMeasure();
    }

    function flip() {
      if (state.flipping || !state.ready) return;
      stopSpray();
      state.flipping = true; state.flip = 0;
      audio.resume();
    }

    var lastMeasure = 0;
    function maybeMeasure() {
      var now = performance.now();
      if (now - lastMeasure < 90) return;
      lastMeasure = now;
      var sd = sides[state.side];
      sd.progress = Math.max(sd.progress, measureClean(sd));
      updateProgressUI();
      checkComplete();
    }
    function updateProgressUI() {
      var sd = sides[state.side];
      var fill = $(config.progressFillId), txt = $(config.progressTextId);
      var pct = Math.round(Math.min(1, sd.progress) * 100);
      if (fill) fill.style.width = pct + '%';
      var label = (state.side === 0 ? '正面' : '背面') + '清洁度 ' + pct + '%';
      if (txt) txt.textContent = label;
      var f = $(config.faceTagId);
      if (f) f.textContent = state.side === 0 ? '第 1 面 / 共 2 面' : '第 2 面 / 共 2 面';
    }
    function checkComplete() {
      if (state.done) return;
      var a = sides[0].progress >= 0.82, b = sides[1].progress >= 0.82;
      if (a && b) complete();
    }
    function complete() {
      state.done = true; state.doneAt = state.t;
      state.spraying = false; state.progress = 1;
      audio.stopWater(); audio.success(); spawnConfetti();
      var overlay = $(config.doneOverlayId);
      if (overlay) {
        var w = $(config.thanksTextId);
        if (w) w.textContent = config.thanks || '谢谢你把我洗得干干净净！';
        var em = $(config.doneEmojiId);
        if (em) em.textContent = config.doneEmoji || '✨';
        overlay.classList.add('show');
      }
      if (config.onComplete) config.onComplete();
    }

    function drawFrame(ts) {
      var dt = Math.min((ts - state.lastTs) / 16.67 || 1, 3);
      state.lastTs = ts; state.t += dt;

      // 翻面动画
      if (state.flipping) {
        state.flip += 0.055 * dt;
        if (state.flip >= 1) {
          state.flip = 0; state.flipping = false;
          state.side = state.side === 0 ? 1 : 0;
          updateProgressUI();
        }
      }

      // 冲洗（仅当前面、非翻面中）
      if (state.spraying && !state.done && !state.flipping && state.ready) {
        eraseRay(sides[state.side]);
        maybeMeasure();
      }

      ctx.save();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.clearRect(0, 0, R, R);

      // 物体随翻面绕垂直轴旋转：scaleX = cos(pi * flip)，中点翻转面
      var sd = sides[state.side];
      var scaleX;
      var midFlip = state.flipping && state.flip >= 0.5;
      var shownSide = midFlip ? sides[state.side === 0 ? 1 : 0] : sd;
      if (state.flipping) {
        var ang = Math.PI * state.flip;
        scaleX = Math.cos(ang);
      } else scaleX = 1;

      ctx.save();
      ctx.translate(R / 2, R / 2);
      ctx.scale(scaleX, 1);
      ctx.translate(-R / 2, -R / 2);
      // 净图底
      if (shownSide.clean) ctx.drawImage(shownSide.clean, 0, 0, R, R);
      // 脏图上层（擦除部分露出净图）
      if (state.ready) {
        ctx.save();
        var fade = 1;
        if (state.done) fade = clamp(1 - (state.t - state.doneAt) / 24, 0, 1);
        ctx.globalAlpha = fade;
        ctx.drawImage(shownSide.canvas, 0, 0, R, R);
        ctx.restore();
      }
      ctx.restore();

      drawWaterJet();
      drawFaucet();
      drawParticles(dt);
      drawConfetti(dt);
      ctx.restore();
      requestAnimationFrame(drawFrame);
    }

    // 真实高压水流：多股半透明水丝 + 微小抖动 + 雾化，避免激光感
    function drawWaterJet() {
      if (!state.spraying || state.done || state.flipping) return;
      var f = flowDir();
      var ox = TAP_X + f.ux * 34, oy = TAP_Y + f.uy * 34; // 枪口
      var px = -f.uy, py = f.ux;                          // 垂直方向
      var reach = Math.hypot(R, R) * 1.35;
      var wob = Math.sin(state.t * 0.6) * 2.2;           // 水流抖动
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      // 外层水雾带（宽、极淡、渐变消散）
      var halo = ctx.createLinearGradient(ox, oy, ox + f.ux * reach, oy + f.uy * reach);
      halo.addColorStop(0, 'rgba(170,220,255,0.20)');
      halo.addColorStop(0.45, 'rgba(190,232,255,0.12)');
      halo.addColorStop(1, 'rgba(210,240,255,0)');
      ctx.strokeStyle = halo; ctx.lineWidth = 26;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + f.ux * reach, oy + f.uy * reach); ctx.stroke();
      // 多股水丝：每股有独立偏移、粗细和透明度，末端收束消散
      var strands = 7;
      for (var i = 0; i < strands; i++) {
        var t = i / (strands - 1) - 0.5;            // -0.5..0.5
        var spread = t * 15;                         // 横向分布
        var wobble = Math.sin(state.t * 0.8 + i * 1.7) * (1.4 + Math.abs(t) * 2);
        var alpha = 0.42 - Math.abs(t) * 0.34 + wob * 0.01;
        var seg = ctx.createLinearGradient(ox, oy, ox + f.ux * reach, oy + f.uy * reach);
        seg.addColorStop(0, 'rgba(225,245,255,' + alpha.toFixed(3) + ')');
        seg.addColorStop(0.55, 'rgba(205,238,255,' + (alpha * 0.7).toFixed(3) + ')');
        seg.addColorStop(1, 'rgba(220,245,255,0)');
        ctx.strokeStyle = seg;
        ctx.lineWidth = 2 + (1 - Math.abs(t)) * 3.5;
        ctx.beginPath();
        ctx.moveTo(ox + px * spread, oy + py * spread);
        var midX = ox + f.ux * reach * 0.5 + px * (spread + wobble);
        var midY = oy + f.uy * reach * 0.5 + py * (spread + wobble);
        var endX = ox + f.ux * reach + px * (spread * 1.6 + wobble * 2);
        var endY = oy + f.uy * reach + py * (spread * 1.6 + wobble * 2);
        ctx.quadraticCurveTo(midX, midY, endX, endY);
        ctx.stroke();
      }
      ctx.restore();
      // 枪口处的白色水花核心
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#EAF8FF';
      ctx.beginPath(); ctx.arc(ox, oy, 6 + Math.sin(state.t) * 1.5, 0, TAU); ctx.fill();
      ctx.restore();
    }

    function drawFaucet() {
      var ox = TAP_X, oy = TAP_Y;
      var ang = flowDir().ang;
      ctx.save();
      ctx.translate(ox, oy);
      // 底座
      ctx.fillStyle = 'rgba(40,70,100,0.18)';
      ctx.beginPath(); ctx.arc(0, 6, TAP_R * 0.62, 0, TAU); ctx.fill();
      // 旋转部分
      ctx.rotate(ang);
      ctx.fillStyle = state.spraying ? '#1E5FC0' : '#2E6FE8';
      roundRect(ctx, -30, -20, 46, 40, 12); ctx.fill();
      ctx.fillStyle = '#4A8BF5';
      roundRect(ctx, 6, -13, 30, 26, 9); ctx.fill();
      ctx.fillStyle = '#BFE4FF';
      roundRect(ctx, 30, -9, 10, 18, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      roundRect(ctx, -24, -14, 16, 8, 4); ctx.fill();
      ctx.restore();
      // 提示环
      ctx.save();
      ctx.strokeStyle = state.spraying ? 'rgba(46,160,255,0.9)' : 'rgba(90,130,170,0.45)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ox, oy, TAP_R * 0.72, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    function drawParticles(dt) {
      ctx.save();
      for (var i = state.particles.length - 1; i >= 0; i--) {
        var p = state.particles[i];
        p.vy += 0.13 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
        if (p.life <= 0) { state.particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, p.life) * 0.85;
        ctx.fillStyle = '#EAF7FF';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      }
      for (var j = state.droplets.length - 1; j >= 0; j--) {
        var d = state.droplets[j];
        d.life -= 0.09 * dt;
        if (d.life <= 0) { state.droplets.splice(j, 1); continue; }
        ctx.globalAlpha = d.life * 0.5;
        ctx.strokeStyle = '#BFE6FF'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(d.x, d.y, (1 - d.life) * 20 + 2, 0, TAU); ctx.stroke();
      }
      // 水雾微粒：细小、半透明、随水流方向飞散
      for (var m = state.mists.length - 1; m >= 0; m--) {
        var w = state.mists[m];
        w.x += w.vx * dt; w.y += w.vy * dt; w.vy += 0.05 * dt; w.life -= w.decay * dt;
        if (w.life <= 0) { state.mists.splice(m, 1); continue; }
        ctx.globalAlpha = Math.max(0, w.life) * 0.5;
        ctx.fillStyle = '#DDF1FF';
        ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
    function drawConfetti(dt) {
      if (!state.confetti.length) return;
      ctx.save();
      for (var i = state.confetti.length - 1; i >= 0; i--) {
        var c = state.confetti[i];
        c.vy += 0.06 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
        if (c.y > R + 30) { state.confetti.splice(i, 1); continue; }
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.color;
        if (c.heart) {
          ctx.scale(c.w / 16, c.w / 16);
          ctx.beginPath(); ctx.moveTo(0, 6);
          ctx.bezierCurveTo(-16, -4, -10, -18, 0, -9);
          ctx.bezierCurveTo(10, -18, 16, -4, 0, 6); ctx.fill();
        } else ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }
      ctx.restore();
    }
    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    // ---------- 事件 ----------
    function isOnFaucet(clientX, clientY) {
      var rect = canvas.getBoundingClientRect();
      var x = (clientX - rect.left) / rect.width * R;
      var y = (clientY - rect.top) / rect.height * R;
      return Math.hypot(x - TAP_X, y - TAP_Y) <= TAP_R;
    }
    canvas.addEventListener('pointerdown', function (e) {
      updateAim(e.clientX, e.clientY);
      if (isOnFaucet(e.clientX, e.clientY)) {
        startSpray();
        if (canvas.setPointerCapture && e.pointerId != null) {
          try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        }
      }
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', function (e) {
      updateAim(e.clientX, e.clientY);
      e.preventDefault();
    });
    global.addEventListener('pointerup', stopSpray);
    global.addEventListener('pointercancel', stopSpray);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var flipBtn = $(config.flipBtnId);
    if (flipBtn) flipBtn.addEventListener('click', flip);
    // 完成后"翻面欣赏"：关闭小卡片并翻面，让游戏者欣赏成果
    var enjoyBtn = $('enjoyBtn');
    if (enjoyBtn) enjoyBtn.addEventListener('click', function () {
      var overlay = $(config.doneOverlayId);
      if (overlay) overlay.classList.remove('show');
      flip();
    });
    var resetBtns = document.querySelectorAll('[data-action="reset"]');
    resetBtns.forEach(function (b) { b.addEventListener('click', reset); });
    var muteBtn = $(config.muteBtnId);
    if (muteBtn) muteBtn.addEventListener('click', function () {
      var muted = audio.toggleMute();
      muteBtn.textContent = muted ? '🔇 音效关' : '🔊 音效开';
    });

    function reset() {
      state.done = false; state.spraying = false;
      state.side = 0; state.flip = 0; state.flipping = false;
      state.particles = []; state.droplets = []; state.mists = []; state.confetti = [];
      audio.stopWater();
      buildSide(sides[0]); buildSide(sides[1]);
      updateProgressUI();
      var overlay = $(config.doneOverlayId);
      if (overlay) overlay.classList.remove('show');
    }

    // ---------- 启动 ----------
    Promise.all([
      loadImage(config.sides[0].clean).then(function (im) { sides[0].clean = im; }),
      loadImage(config.sides[0].dirty).then(function (im) { sides[0].dirty = im; }),
      loadImage(config.sides[1].clean).then(function (im) { sides[1].clean = im; }),
      loadImage(config.sides[1].dirty).then(function (im) { sides[1].dirty = im; })
    ]).then(function () {
      buildSide(sides[0]); buildSide(sides[1]);
      state.ready = true;
      updateProgressUI();
    }).catch(function (err) { console.error('CleanWash init error:', err); });
    requestAnimationFrame(function (ts) { state.lastTs = ts; drawFrame(ts); });

    return { state: state, reset: reset, audio: audio, flip: flip, sides: sides };
  }

  global.CleanWash = { create: create };
})(window);
